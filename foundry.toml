[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false               # Legacy codegen — stack-depth managed by scoping blocks.
                             # Build time: ~4s vs ~17min with via_ir=true.
force = false
# Deploy scripts read no off-chain spec: the RPGF scoring lives on chain in
# src/build/rewards/UsageCounter.sol, so nothing is hashed into a contract.
fs_permissions = [
    { access = "read", path = "test/fixtures/eip712-vectors.json" },
    { access = "read", path = "test/fixtures/merkle-vectors.json" },
    { access = "read-write", path = "test/fixtures/kernel-transition-vectors.json" },
    { access = "read-write", path = "test/fixtures/streams/kernel.jsonl" },
    { access = "read", path = "test/fixtures/streams/agreements.json" },
]
build_info = false
extra_output = []

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
]

# Fast development testing
[fuzz]
runs = 256
[invariant]
runs = 256
depth = 15

# Halmos symbolic testing requires via_ir (compiles all contracts including scripts)
[profile.halmos]
via_ir = true

# Coverage runs under [profile.coverage], the full via-IR pipeline — see
# scripts/coverage.sh, which is the one way to run it.
# GasCeilingTest is excluded from coverage because its assertions are calibrated
# for non-instrumented bytecode — see scripts/coverage.sh.

# Production profile for pre-deployment testing
# Usage: forge build --profile production && forge test --profile production
[profile.production]
optimizer = true
optimizer_runs = 10000       # Maximum optimization
via_ir = true                 # Full IR compilation

[profile.production.fuzz]
runs = 10000

[profile.production.invariant]
runs = 5120
depth = 100

# Coverage profile: `FOUNDRY_PROFILE=coverage forge coverage` (scripts/coverage.sh).
# The full via-IR pipeline with the optimizer's stack allocation: the minimal-
# optimization path (--ir-minimum) no longer compiles the batch verifier's
# decoder under coverage instrumentation.
[profile.coverage]
optimizer = true
optimizer_runs = 200
via_ir = true
# Two gas-anchor tests are calibrated for non-instrumented bytecode and fail
# under coverage's shadow counters — see scripts/coverage.sh for the measured
# figures. Both measure gas cost, not correctness; kept in sync with the CLI
# --no-match-test in scripts/coverage.sh (which takes precedence when set).
no_match_test = "test_Gas_resolveExecutionMarginal|test_Gas_recordUsageStaysAtItsAnchor"

[profile.coverage.optimizer_details.yul_details]
stack_allocation = true

[profile.coverage.fuzz]
runs = 256

# Contract verification on block explorers.
# Set ETHERSCAN_API_KEY env var or use --etherscan-api-key flag.
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/api" }
