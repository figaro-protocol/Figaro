\* TLC configuration for RelayState — the relay's state lifecycle
\* (prover/sequencer/src/state.rs, main.rs) under crashes, write failures,
\* refused batches, permissionless resends and takeover.
\*
\*   2 relays       — two relays racing on one root, and one taking over
\*                    from the other, are both reachable
\*   3 batches      — a batch landed whose kept file lagged, a batch built
\*                    on it, and one more: the shortest histories the three
\*                    defects below need
\*
\* THE FIVE SWITCHES. All TRUE is the relay as it must run. Flip any one to
\* FALSE and re-run: the first four must fail `Recoverable`, the fifth must
\* fail `SendsExcludeKnownRevoked` — that is the check that the model
\* reaches the states each defect needs.
\*   HoldBeforeSend         — FALSE: state written after the send
\*   HoldThroughRevert      — FALSE: a refused batch's state dropped
\*   KeepRetainsBuiltOnRoot — FALSE: adopting a root clears the journal
\*   TakeoverChecksRoot     — FALSE: a kept file overwritten with another
\*                            relay's GET /state whatever root it serves
\*   RebatchDropsRevoker    — FALSE: a revocation refusal re-sends the same
\*                            batch instead of dropping the revoker
\*
\* THE WORLD AND THE DESIGN. `ForeignSubmitters` TRUE admits a submitter that
\* is no relay of the model: it lands a batch on a copy of the state and
\* publishes nothing. `OpsOnChain` TRUE is the accepted design: every batch
\* carries its signed operations in its own transaction, so the chain
\* rebuilds the state behind any root. The checks:
\*   all TRUE                                   — holds
\*   OpsOnChain = FALSE (today's verifier)      — fails `Recoverable`: the
\*                            foreign batch's state is nowhere a stranger
\*                            can reach; the defect the batch review found
\*   the four relay switches, each FALSE, with OpsOnChain = FALSE and
\*   ForeignSubmitters = FALSE                  — each fails `Recoverable`
\*                            (the world where the relays' discipline is
\*                            the only keeper of the state)

SPECIFICATION Spec

\* Bounded model: the fresh roots exhaust, which is expected terminal
\* behaviour, not a violation.
CHECK_DEADLOCK FALSE

CONSTANTS
    Relays = {r1, r2}
    Parties = {pA, pB}
    MaxBatches = 3
    HoldBeforeSend = TRUE
    HoldThroughRevert = TRUE
    KeepRetainsBuiltOnRoot = TRUE
    TakeoverChecksRoot = TRUE
    RebatchDropsRevoker = TRUE
    OpsOnChain = TRUE
    ForeignSubmitters = TRUE
    \* The deferral's constants: `Spec` holds the deferral's variables at
    \* their initial values and reads none of these.
    \* RelayStateDeferral.cfg checks the deferral.
    DCap = 2
    DWindow = 2
    DMaxTime = 5
    DMaxRequeues = 1
    DMaxAttempts = 1
    DeferBoundedInTime = TRUE
    DeferOwnCounter = TRUE
    DeferDrainsOnlyFreeSlots = TRUE
    DeferMovesDependents = TRUE
    DeferDropsCopy = TRUE
    DeferGroupsByProcess = TRUE
    DeferOwnWindow = TRUE
    DeferDependentEdge = TRUE
    AdmitRefusesDoubleListing = TRUE

INVARIANTS
    TypeOK
    Recoverable
    ChainCarriesEveryLandedBatch
    BuiltOnVerifierRoot
    MirrorOnVerifierRoot
    KeptOnVerifierRoot
    JournalBuiltOnVerifierRoot
    HistoryHasNoRepeat

PROPERTIES
    MirrorNeverGoesBack
    SendsExcludeKnownRevoked
