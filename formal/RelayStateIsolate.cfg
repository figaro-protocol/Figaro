\* TLC configuration for RelayState's fifth spec, `IsolateSpec` — a batch
\* the chain refused naming nobody (prover/sequencer/src/submitter.rs
\* `classify_deterministic_revert`, mempool.rs `isolate` and `drain_up_to`).
\* The other specs' variables hold their initial values here.
\*
\*   4 operations   — any of them offenders, chosen at the start: each
\*                    reverts any settle it rides in, naming nobody, or
\*                    lets it land
\*   split budget   — ⌈log2 4⌉ + ISlack = 3, every split four operations
\*                    need; RelayStateIsolateCap.cfg sets ISlack = 0
\*
\* THE SWITCH. Unlike the module's other switches, TRUE restores the defect:
\* `WholeBatchOnUnnamedRevert` TRUE is the old relay, which dead-letters a
\* batch refused naming nobody whole, and the model must then fail
\* `HonestNeverDroppedForAnother` (an honest operation batched beside an
\* offender is dead-lettered). FALSE is the relay as it must run: the refused
\* set is split into halves, each tried alone, until the operation that
\* reverts alone is dead-lettered alone.

SPECIFICATION IsolateSpec

\* Bounded model: every operation landed or dead-lettered is terminal, which
\* is expected behaviour, not a violation.
CHECK_DEADLOCK FALSE

CONSTANTS
    Relays = {r1}
    Parties = {pA}
    MaxBatches = 1
    HoldBeforeSend = TRUE
    HoldThroughRevert = TRUE
    KeepRetainsBuiltOnRoot = TRUE
    RebatchDropsRevoker = TRUE
    OpsOnChain = TRUE
    ForeignSubmitters = TRUE
    DCap = 2
    DWindow = 2
    DMaxTime = 5
    DMaxRequeues = 1
    DMaxAttempts = 1
    DeferBoundedInTime = TRUE
    DeferOwnCounter = TRUE
    DeferDrainsOnlyFreeSlots = TRUE
    DeferMovesDependents = TRUE
    DeferDropsCopy = TRUE
    DeferGroupsByProcess = TRUE
    DeferOwnWindow = TRUE
    DeferDependentEdge = TRUE
    AdmitRefusesDoubleListing = TRUE
    ResolveBoundToState = TRUE
    VerifierChecksWalletCode = TRUE
    VerifierChecksAttestationCode = TRUE
    WholeBatchOnUnnamedRevert = FALSE
    ISlack = 1

INVARIANTS
    ITypeOK
    HonestNeverDroppedForAnother
    IsolationBounded
