\* TLC configuration for the reachability witness of RelayState's fifth
\* spec, `IsolateSpec`: with ISlack = 0 the split budget for four operations
\* is 2, short of the three splits they can need. `IsolationCapWitness` MUST
\* BE VIOLATED: the budget runs out and dead-letters an honest operation
\* beside an offender, unattributed (prover/sequencer/src/mempool.rs
\* `isolate`, the ISOLATION CAP reason) — the residual the handover's
\* limitation 3 states, shown reachable. scripts/test-tla.sh fails if TLC
\* does not report the violation.

SPECIFICATION IsolateSpec

\* Bounded model: every operation landed or dead-lettered is terminal, which
\* is expected behaviour, not a violation.
CHECK_DEADLOCK FALSE

CONSTANTS
    Relays = {r1}
    Parties = {pA}
    MaxBatches = 1
    HoldBeforeSend = TRUE
    HoldThroughRevert = TRUE
    KeepRetainsBuiltOnRoot = TRUE
    RebatchDropsRevoker = TRUE
    OpsOnChain = TRUE
    ForeignSubmitters = TRUE
    DCap = 2
    DWindow = 2
    DMaxTime = 5
    DMaxRequeues = 1
    DMaxAttempts = 1
    DeferBoundedInTime = TRUE
    DeferOwnCounter = TRUE
    DeferDrainsOnlyFreeSlots = TRUE
    DeferMovesDependents = TRUE
    DeferDropsCopy = TRUE
    DeferGroupsByProcess = TRUE
    DeferOwnWindow = TRUE
    DeferDependentEdge = TRUE
    AdmitRefusesDoubleListing = TRUE
    ResolveBoundToState = TRUE
    VerifierChecksWalletCode = TRUE
    VerifierChecksAttestationCode = TRUE
    WholeBatchOnUnnamedRevert = FALSE
    ISlack = 0

INVARIANTS
    IsolationCapWitness
