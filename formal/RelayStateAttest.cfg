\* TLC configuration for RelayState's fourth spec, `AttestSpec` — an
\* attestation on the batch path (prover/lib/src/kernel.rs
\* `apply_attestation`, FigaroBatchVerifier `_attestByWalletCode`). The other
\* specs' variables hold their initial values here.
\*
\* THE DESIGN SWITCH. An attestation comes in two forms: the party's ECDSA
\* signature, or bytes the party's own code validates, which the guest
\* publishes in the stream's 0x05 entry unchecked. The party's wallet
\* installs its code while it holds its key and may then lose the key. TRUE
\* is the verifier as it must run: it emits a wallet-code attestation only if
\* the party's account has code and the code validates the digest, and skips
\* it otherwise. Flip it to FALSE: the verifier emits it on the guest's word,
\* and the model must fail `OnlyPartyAttests` (a stranger's bytes attest).

SPECIFICATION AttestSpec

\* Bounded model: a resolved process is terminal, which is expected
\* behaviour, not a violation.
CHECK_DEADLOCK FALSE

CONSTANTS
    Relays = {r1}
    Parties = {pA}
    MaxBatches = 1
    HoldBeforeSend = TRUE
    HoldThroughRevert = TRUE
    KeepRetainsBuiltOnRoot = TRUE
    RebatchDropsRevoker = TRUE
    OpsOnChain = TRUE
    ForeignSubmitters = TRUE
    DCap = 2
    DWindow = 2
    DMaxTime = 5
    DMaxRequeues = 1
    DMaxAttempts = 1
    DeferBoundedInTime = TRUE
    DeferOwnCounter = TRUE
    DeferDrainsOnlyFreeSlots = TRUE
    DeferMovesDependents = TRUE
    DeferDropsCopy = TRUE
    DeferGroupsByProcess = TRUE
    DeferOwnWindow = TRUE
    DeferDependentEdge = TRUE
    AdmitRefusesDoubleListing = TRUE
    ResolveBoundToState = TRUE
    VerifierChecksWalletCode = TRUE
    VerifierChecksAttestationCode = TRUE

INVARIANTS
    RTypeOK
    OnlyPartyAttests
