
CONSTANTS
    MAX_SUPPLY = 5
    Minters = {"deployer", "minter1", "minter2"}
    Recipients = {"deployer", "minter1", "minter2", "alice", "bob", "0x0"}

SPECIFICATION Spec

\* Deadlock check disabled: the model admits a terminal state where
\* deployer renounces before registering any minters, freezing supply at 0.
\* That is a legitimate (if unhelpful) end state allowed by the real contract,
\* not a safety-invariant violation. We verify invariants only.
CHECK_DEADLOCK FALSE

INVARIANTS
    Inv_MaxSupply
    Inv_DeployerCannotMintAfterRenounce
    Inv_MinterCap
    Inv_CapBelowMaxSupply
    Inv_SupplyEqualsSumMinted
    Inv_NonNegative
    Inv_NoMintToZero
    Inv_BalancesSumToSupply
