\* TLC configuration for the WitnessSwapAndCommitCoordinator funds state machine.
\*
\* Constants are deliberately small: the properties are structural (conservation,
\* zero retention, atomicity, bond arithmetic), so a compact domain that still
\* reaches every branch is worth more than a large one that times out.
\*
\*   MaxPayment      = 2   → payments 1..2, buyer bond 2 or 4
\*   MaxCumExcess    = 1   → expectedCumulativeValue may exceed payment, which the
\*                           kernel's root guard rejects — the revert-AFTER-swap
\*                           path that makes Inv_Atomicity bite
\*   MaxInput        = 3   → Permit2 maxInput ceiling 1..3 (over- and exact-pulls)
\*   MaxSwapOutput   = 4   → the venue may return 0..4 (below, at, and above bond)
\*   PartyBond       = 6   → enough for a party to SELF-fund a leg (enabled = FALSE)
\*   PartyInput      = 3   → enough to fund the maximum maxInput pull
\*   RouterLiquidity = 12  → the venue can always pay out MaxSwapOutput
\*   MaxTx           = 3   → three sequential calls, so zero retention, allowance
\*                           hygiene and escrow accumulation are checked ACROSS
\*                           calls (including a reverted call followed by a
\*                           successful one), not just within a single call
\*
\* Exhaustive run: 38,028,525 states generated / 1,979,101 distinct, depth 17,
\* ~3 minutes with -workers auto.

SPECIFICATION Spec

\* Deadlock checking disabled — the bounded model exhausts its MaxTx call slots
\* and stops. That is the model bound, not a liveness failure.
CHECK_DEADLOCK FALSE

CONSTANTS
    MaxPayment      = 2
    MaxCumExcess    = 1
    MaxInput        = 3
    MaxSwapOutput   = 4
    PartyBond       = 6
    PartyInput      = 3
    RouterLiquidity = 12
    MaxTx           = 3

INVARIANTS
    Inv_TypeOK
    Inv_Conservation
    Inv_NonNegative
    Inv_ZeroRetention
    Inv_AllowanceHygiene
    Inv_Atomicity
    Inv_BondFormula
    Inv_CoreEscrowExact
    Inv_WitnessRouteBinding
    Inv_CoordinatorNotCounterparty
