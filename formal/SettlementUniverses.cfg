\* TLC configuration for SettlementUniverses — Figaro's COMPOSED settlement
\* system (FigaroCore + FigaroBatchVerifier + UsageCounter + the off-chain
\* guest kernel), checked across arbitrary cross-universe interleavings.
\*
\* Constants are deliberately tiny: the bond ARITHMETIC is already verified
\* exhaustively by formal/MC.cfg (2 buyers, 2 sellers, payments 1-3). What
\* this model checks is COMPOSITION, so the interesting dimensions are the
\* number of universes an order can enter, the number of distinct sellers
\* (the RPGF breadth term `d`) and the number of accrual periods.
\*
\*   1 buyer          — buyer dominance means one resolver per process
\*   2 sellers        — the RPGF breadth term `d` can reach 2
\*   2 processes      — one per universe, or two in one
\*   1 sub-order      — 4 order identities; cumulative upstream bonding and
\*                      multi-order ATOMIC resolution are both reachable
\*   payments 1-2     — enough that net positions do not degenerate
\*   2 artifacts      — a2 is EXCLUDED (the mandatory-clause case)
\*   2 periods        — enough for a period boundary to race a batch
\*   MinSellers = 1   — the floor DISABLED (UsageCounter's own "1 disables the
\*                      floor"; mainnet uses 3). Chosen so BOTH score
\*                      components can be non-zero in the same state, which is
\*                      what makes ScoreComposition / TotalScoreIntegrity
\*                      non-vacuous: with MinSellers = 2 a path needs two
\*                      counted processes to score at all, and only two process
\*                      identities exist. Re-running with MinSellers = 2 (also
\*                      green, same size) exercises FloorAppliedPerPath
\*                      instead; exercising both at once needs MaxProcesses = 4,
\*                      which does not finish in minutes.
\*
\* THE TWO NAMED ASSUMPTIONS. Both TRUE is the shipped system. Flip either to
\* FALSE and re-run: that is the experiment the model exists for.
\*   AssumeDomainSeparation    — CONTRACT-ENFORCED (settleBatch requires
\*                               pv.verifyingContract == address(this), so the
\*                               guest's EIP-712 domain ≠ FigaroCore's).
\*                               FALSE ⇒ NoDoublePayout,
\*                               UniverseDisjointOrders,
\*                               BatchInvisibleToKernelGates and
\*                               ProcessCountedInOneUniverse all fail.
\*   AssumeAccrualGatesAligned — NOT contract-enforced (the sequencer must
\*                               re-prove across a period boundary).
\*                               FALSE ⇒ AccrualNotLost and NoAccrualDrop
\*                               fail; every other invariant still holds,
\*                               including AccrualNeverOverPays.

SPECIFICATION Spec

\* Bounded model: the finite process/order/period slots exhaust, which is
\* expected terminal behavior, not a violation. Same posture as MC.cfg.
CHECK_DEADLOCK FALSE

CONSTANTS
    Buyers            = {"b1"}
    Sellers           = {"s1", "s2"}
    Artifacts         = {"a1", "a2"}
    ExcludedArtifacts = {"a2"}
    InitialBalance    = 12
    MaxPayment        = 2
    MaxProcesses      = 2
    MaxSubOrders      = 1
    NumPeriods        = 2
    MinSellers        = 1
    AssumeDomainSeparation    = TRUE
    AssumeAccrualGatesAligned = TRUE

INVARIANTS
    TypeOK

    \* 1 — no value paid out twice across the universes
    NoDoublePayout
    UniverseDisjointOrders

    \* 2 — token conservation across buyer / sellers / Core / Verifier
    TokenConservation
    CoreSolvency
    VerifierSolvency
    WalletNonNegative
    CoreExactEscrow
    VerifierExactEscrow
    ResolutionAlwaysPossible

    \* 3 — usage-score composition
    ScoreCacheCorrect
    ScoreComposition
    TotalScoreIntegrity
    BatchWriteReplacesNeverAdds
    FloorAppliedPerPath
    ExcludedNeverScores

    \* 4 — kernel blindness is faithful
    KernelBlindToBatch
    BatchInvisibleToKernelGates

    \* 5 — RPGF: a process is counted in exactly one universe
    ProcessCountedInOneUniverse

    \* 6 — the accrual bridge under a period race
    AccrualNotLost
    NoAccrualDrop
