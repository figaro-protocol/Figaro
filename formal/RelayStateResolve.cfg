\* TLC configuration for RelayState's third spec, `ResolveSpec` — the
\* buyer's resolve authorization on the batch path
\* (prover/lib/src/kernel.rs `apply_resolve`, eip712.rs
\* `resolve_struct_hash`). The state lifecycle's and the deferral's
\* variables hold their initial values here; RelayState.cfg and
\* RelayStateDeferral.cfg check them.
\*
\*   3 orders       — the root order, one committed after a signature, and
\*                    one more
\*   payments 1..2  — every payment at least 1, as the Core requires
\*   signed values  — the value the process holds, or any it has not
\*                    reached (the relay holds such a resolve until the
\*                    buyer's own commits bring the process to it)
\*
\* THE DESIGN SWITCH. TRUE is the guest as it must run: the authorization
\* signs the process id and a cumulative value, and is refused unless the
\* process's cumulative value at application is the signed one. Flip it to
\* FALSE and re-run: the authorization signs the process id alone, and the
\* model must fail `ResolvePaysSignedPrefix` (signed over the root order,
\* applied after a second order commits, both are paid).
\*
\* THE SECOND SWITCH. The authorization comes in two forms: the buyer's
\* ECDSA signature, or bytes the buyer's own account code validates
\* (ERC-1271), which the guest publishes in the operation stream without
\* checking and FigaroBatchVerifier checks against the buyer's code at
\* resolution. The wallet installs its code while it holds its key and may
\* then lose the key. TRUE is the verifier as it must run: a wallet-code
\* resolve lands only if the buyer's account has code and the code
\* validates the digest. Flip it to FALSE: the verifier takes the second
\* form on the guest's word, and the model must fail
\* `OnlyBuyerWalletResolves` (a stranger's bytes resolve the process).

SPECIFICATION ResolveSpec

\* Bounded model: a resolved process is terminal, which is expected
\* behaviour, not a violation.
CHECK_DEADLOCK FALSE

CONSTANTS
    Relays = {r1}
    Parties = {pA}
    MaxBatches = 1
    HoldBeforeSend = TRUE
    HoldThroughRevert = TRUE
    KeepRetainsBuiltOnRoot = TRUE
    TakeoverChecksRoot = TRUE
    RebatchDropsRevoker = TRUE
    OpsOnChain = TRUE
    ForeignSubmitters = TRUE
    DCap = 2
    DWindow = 2
    DMaxTime = 5
    DMaxRequeues = 1
    DMaxAttempts = 1
    DeferBoundedInTime = TRUE
    DeferOwnCounter = TRUE
    DeferDrainsOnlyFreeSlots = TRUE
    DeferMovesDependents = TRUE
    DeferDropsCopy = TRUE
    DeferGroupsByProcess = TRUE
    DeferOwnWindow = TRUE
    DeferDependentEdge = TRUE
    AdmitRefusesDoubleListing = TRUE
    ResolveBoundToState = TRUE
    VerifierChecksWalletCode = TRUE

INVARIANTS
    RTypeOK
    ResolvePaysSignedPrefix
    OnlyBuyerWalletResolves
