SPECIFICATION Spec

\* Deadlock checking disabled — bounded model exhausts finite process/order
\* slots, which is expected terminal behavior, not an invariant violation.
CHECK_DEADLOCK FALSE

\* Model values (addresses)
CONSTANT b1 = b1
CONSTANT b2 = b2
CONSTANT s1 = s1
CONSTANT s2 = s2

\* Parameter bindings
CONSTANT Buyers         <- MCBuyers
CONSTANT Sellers        <- MCSellers
CONSTANT InitialBalance <- MCInitialBalance
CONSTANT MaxPayment     <- MCMaxPayment
CONSTANT MaxProcesses   <- MCMaxProcesses
CONSTANT MaxSubOrders   <- MCMaxSubOrders

\* Safety invariants
INVARIANT TypeOK
INVARIANT TokenConservation
INVARIANT ContractSolvency
INVARIANT WalletNonNegative
INVARIANT CumulativeIntegrity
INVARIANT ActiveCountCorrect
INVARIANT ResolutionAlwaysPossible
