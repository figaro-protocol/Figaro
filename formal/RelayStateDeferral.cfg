\* TLC configuration for RelayState's second half, `DeferSpec` — the
\* deferral of an operation dropped at batch formation
\* (prover/sequencer/src/main.rs, mempool.rs). The state lifecycle's
\* variables hold their initial values here; RelayState.cfg checks them.
\*
\*   5 operations   — "a" a commit and "b" built on a's order, honest, of
\*                    process P1; "f" and "g" that never apply, which
\*                    anyone may submit free, each once at any tick — f
\*                    naming P1, g naming P2; "r" a resolve of P1 listing an
\*                    order twice, which admission refuses (fixed in the
\*                    module)
\*   drain cap 3    — a, b and f drained together: P1's three operations,
\*                    one group
\*   window 2 ticks — a deferral retried every tick and one never retried
\*                    both reach the window inside 4 ticks
\*   re-queue cap 1 — a second transient failure dead-letters
\*
\* THE NINE DEFERRAL SWITCHES. All TRUE is the relay as it must run. Flip
\* any one to FALSE and re-run: each must fail the invariant named.
\*   DeferBoundedInTime       — FALSE: bounded in attempts
\*                              (fails DeferralBoundedInTime)
\*   DeferOwnCounter          — FALSE: a deferral spends the re-queue's
\*                              counter (fails RequeueCapCountsTransients)
\*   DeferDrainsOnlyFreeSlots — FALSE: a deferral goes back to the queue's
\*                              front (fails NoExtraDraining)
\*   DeferMovesDependents     — FALSE: what was built on a deferred
\*                              operation is dead-lettered
\*                              (fails BuiltOnOnlyBehindDead)
\*   DeferDropsCopy           — FALSE: a copy resubmitted meanwhile stays
\*                              queued (fails NoTwoCopies)
\*   DeferGroupsByProcess     — FALSE: a tick's deferrals are one group
\*                              (fails DrainGroupIsAClass)
\*   DeferOwnWindow           — FALSE: a group with an operation past its
\*                              window is dead-lettered whole
\*                              (fails HonestWindowKept when checked alone
\*                              with the honest side held to the commit —
\*                              DHonest edited to {"a"} in the module; with
\*                              DHonest as it stands, DeferralBoundedInTime
\*                              is reported first)
\*   DeferDependentEdge       — FALSE: an operation expires on its own
\*                              window alone, what was filtered behind it
\*                              left deferred
\*                              (fails DependentLeavesWithItsDependency)
\*   AdmitRefusesDoubleListing — FALSE: a resolve listing an order twice
\*                              is admitted
\*                              (fails DoubleListingNeverAdmitted)

SPECIFICATION DeferSpec

\* Bounded model: the ticks exhaust, which is expected terminal behaviour,
\* not a violation.
CHECK_DEADLOCK FALSE

CONSTANTS
    Relays = {r1}
    Parties = {pA}
    MaxBatches = 1
    HoldBeforeSend = TRUE
    HoldThroughRevert = TRUE
    KeepRetainsBuiltOnRoot = TRUE
    TakeoverChecksRoot = TRUE
    RebatchDropsRevoker = TRUE
    OpsOnChain = TRUE
    ForeignSubmitters = TRUE
    DCap = 3
    DWindow = 2
    DMaxTime = 4
    DMaxRequeues = 1
    DMaxAttempts = 1
    DeferBoundedInTime = TRUE
    DeferOwnCounter = TRUE
    DeferDrainsOnlyFreeSlots = TRUE
    DeferMovesDependents = TRUE
    DeferDropsCopy = TRUE
    DeferGroupsByProcess = TRUE
    DeferOwnWindow = TRUE
    DeferDependentEdge = TRUE
    AdmitRefusesDoubleListing = TRUE
    ResolveBoundToState = TRUE

INVARIANTS
    DTypeOK
    DeferralBoundedInTime
    RequeueCapCountsTransients
    NoExtraDraining
    BuiltOnOnlyBehindDead
    NoTwoCopies
    HonestWindowKept
    DependentLeavesWithItsDependency
    DrainGroupIsAClass
    DoubleListingNeverAdmitted
