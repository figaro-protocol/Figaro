[package]
name = "figaro-prover-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"
description = "cargo-fuzz target for the bytes the relay and a rebuild read from the chain: the operation-stream decoder (prover/lib)."

[package.metadata]
cargo-fuzz = true

# Its own workspace and its own lock: the proof program's workspace
# (prover/Cargo.toml, prover/Cargo.lock) and its toolchain pin stay as they
# are, so the verification key does not move. The crate is reached by path,
# read only.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
figaro-kernel = { path = "../../prover/lib" }

[[bin]]
name = "operation_stream"
path = "fuzz_targets/operation_stream.rs"
test = false
doc = false
bench = false
