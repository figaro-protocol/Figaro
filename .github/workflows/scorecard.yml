name: OpenSSF Scorecard

# The OpenSSF Scorecard over this repository, weekly and on dispatch. The
# result is kept as a workflow artifact only, in SARIF and in JSON:
# `publish_results` stays false, so nothing is sent to the Scorecard public
# API, and nothing is uploaded to code scanning. The workflow gates no merge.
#
# The run reads the repository with the workflow's own token, so the
# Branch-Protection check scores what that token can read; a check that
# needs an admin's view reports that it could not read it.

on:
    workflow_dispatch:
    schedule:
        - cron: "17 5 * * 1"

permissions:
    contents: read

jobs:
    scorecard:
        name: Scorecard
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Run Scorecard (SARIF)
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: scorecard.sarif
                  results_format: sarif
                  publish_results: false

            - name: Run Scorecard (JSON)
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: scorecard.json
                  results_format: json
                  publish_results: false

            - name: Keep the results
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: scorecard-results
                  path: |
                      scorecard.sarif
                      scorecard.json
                  retention-days: 90
