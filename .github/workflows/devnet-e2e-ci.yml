name: Devnet E2E CI

# The bilateral spine end-to-end (buyer orders → seller accepts → commit), the
# highest-catch layer, run against a REAL stack in the runner: Anvil + a
# deployed protocol + Kubo (IPFS) + the production static export.
#
# Every run of the e2e job first runs the walletless four-family registries
# spec on the bare genesis the deploy leaves, before any test population.
#
# Four jobs. `scope` decides what the run covers; `relay` builds the relay
# for the full scope; `devnet-e2e` runs the scope, one job and one copy of
# the stack setup whatever the scope; `gate` is the one result a branch
# protection rule requires.
#
# The scopes:
#   - full: the whole Playwright `devnet` project — every runtime
#     *.devnet.spec.ts after its `devnet-authoring` dependency — through
#     `npm run test:e2e:devnet`, the same command a laptop runs, then the
#     `devnet-standalone` project's four specs on the same chain. The nightly
#     schedule, a dispatch with suite=full, and a pull request that touches a
#     flow path (the app routes, frontend/lib, the SDK's source, the
#     contracts, or this file). The full scope deploys with the relay this
#     tree builds, so the batch-events spec runs, and a skip of it fails.
#   - spine: the `orders-accept` spec (the bilateral spine) only. A push to
#     main or develop, a dispatch with suite=spine, and a pull request that
#     touches the rest of the stack the push trigger watches (the deploy, the
#     clauses, the rest of the frontend or the SDK) but no flow path.
#   - none: a pull request that touches neither; the e2e job is skipped.
# Either scope then runs the stranger crawl (the Playwright `stranger`
# project's `crawl.stranger.spec.ts`), the four origination proofs
# (in-process / HTTP socket / A2A / multi-order chain) and the watcher's test
# against the same live stack.
#
# The pull request trigger carries no `paths` filter on purpose: a required
# check that a filter skips never reports, and GitHub then blocks the merge.
# The `scope` job filters instead, and `gate` reports on every pull request.

on:
    # Nightly, 03:37 UTC. GitHub starts this repository's scheduled runs hours
    # after their cron time (five to eight, measured on monitor.yml and
    # estate-snapshot.yml) and may drop one under load; a dispatch with
    # suite=full runs the same scope on demand.
    schedule:
        - cron: "37 3 * * *"
    workflow_dispatch:
        inputs:
            suite:
                description: "spine = the orders-accept spec (the push scope); full = the whole devnet project (the nightly scope)"
                type: choice
                options: [spine, full]
                default: spine
    push:
        branches: [main, develop]
        paths:
            - "src/**"
            - "script/**"
            - "sdk/**"
            - "frontend/**"
            - "clauses/**"
            - "agreements/**"
            - "assemblies/**"
            # The deploy, and what must hold after it (it runs the check).
            - "scripts/deploy-local.sh"
            - "scripts/check-deployment.mjs"
            - "deployments/*.expected.json"
            - "scripts/monitor-sepolia.mjs"
            - "scripts/test-monitor.mjs"
            # The deploy tooling and its tests.
            - "scripts/check-deployment-*.mjs"
            - "scripts/check-release-revision.mjs"
            - "scripts/verify-etherscan.mjs"
            - "scripts/propose-gas-constants.mjs"
            - "scripts/test-*.mjs"
            - "scripts/seed/**"
            - "scripts/prover-box/checkout-release.sh"
            - "scripts/prover-box/test-checkout-release.sh"
            - ".github/workflows/devnet-e2e-ci.yml"
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

# A new push to a pull request cancels the run it supersedes; the schedule,
# a dispatch and a push to a branch each run to the end.
concurrency:
    group: devnet-e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    scope:
        name: Scope
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            scope: ${{ steps.decide.outputs.scope }}
        steps:
            # The merge commit a pull request checks out has the base branch
            # as its first parent: two commits of history hold the diff.
            - name: Checkout code
              if: github.event_name == 'pull_request'
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 2

            - name: Decide the scope
              id: decide
              env:
                  EVENT: ${{ github.event_name }}
                  SUITE: ${{ inputs.suite }}
              run: |
                  case "$EVENT" in
                      schedule) scope=full ;;
                      workflow_dispatch) scope="$SUITE" ;;
                      push) scope=spine ;;
                      pull_request)
                          scope=none
                          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
                          echo "Files the pull request changes:"
                          cat "$RUNNER_TEMP/changed.txt"
                          while IFS= read -r f; do
                              case "$f" in
                                  # Flow paths: the whole suite.
                                  "frontend/app/(app)/"*|frontend/lib/*|sdk/src/*|src/*|.github/workflows/devnet-e2e-ci.yml)
                                      scope=full
                                      break
                                      ;;
                                  # The rest of the stack the push trigger
                                  # watches: the spine.
                                  script/*|sdk/*|frontend/*|clauses/*|agreements/*|assemblies/*|scripts/deploy-local.sh|scripts/check-deployment.mjs|deployments/*.expected.json|scripts/monitor-sepolia.mjs|scripts/test-*.mjs|scripts/check-deployment-*.mjs|scripts/check-release-revision.mjs|scripts/verify-etherscan.mjs|scripts/propose-gas-constants.mjs|scripts/seed/*|scripts/prover-box/checkout-release.sh|scripts/prover-box/test-checkout-release.sh)
                                      scope=spine
                                      ;;
                              esac
                          done < "$RUNNER_TEMP/changed.txt"
                          ;;
                      *)
                          echo "::error::Unhandled event $EVENT"
                          exit 1
                          ;;
                  esac
                  echo "Scope: $scope"
                  echo "scope=$scope" >> "$GITHUB_OUTPUT"

    # The relay (prover/sequencer) this tree builds, for the full scope only.
    # The batch-events spec drives a batched order through it, and the deploy
    # pins the guest fingerprint it reports (scripts/deploy-local.sh, `sequencer
    # --vkey`), so the relay passes its own startup check against the devnet
    # verifier. The toolchain is installed as prover-ci.yml's `sp1` job does.
    # A job of its own, passing only the binary on: the e2e job keeps its disk
    # for the stack, and the relay's build directory never enters it.
    relay:
        name: Relay build (full scope)
        needs: scope
        if: needs.scope.outputs.scope == 'full'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Read pinned Rust toolchain
              run: |
                  RUST_TOOLCHAIN=$(awk -F'"' '/^channel/{print $2}' prover/rust-toolchain.toml)
                  if [ -z "$RUST_TOOLCHAIN" ]; then
                      echo "could not read channel from prover/rust-toolchain.toml"
                      exit 1
                  fi
                  echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

            - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
              run: |
                  rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
                  rustup default "$RUST_TOOLCHAIN"
                  rustc --version

            - name: Read pinned SP1 version
              run: |
                  SP1_VERSION=v$(awk '/^name = "sp1-sdk"$/{getline; gsub(/version = |"/, ""); print; exit}' prover/Cargo.lock)
                  if [ "$SP1_VERSION" = "v" ]; then
                      echo "could not read the sp1-sdk version from prover/Cargo.lock"
                      exit 1
                  fi
                  echo "SP1_VERSION=$SP1_VERSION" >> "$GITHUB_ENV"

            - name: Install SP1 ${{ env.SP1_VERSION }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p "$HOME/.sp1/bin"
                  curl -sSfL "https://raw.githubusercontent.com/succinctlabs/sp1/${SP1_VERSION}/sp1up/sp1up" \
                      -o "$HOME/.sp1/bin/sp1up"
                  chmod +x "$HOME/.sp1/bin/sp1up"
                  "$HOME/.sp1/bin/sp1up" --version "$SP1_VERSION"
                  echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

            - name: Install protoc
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
                  protoc --version

            # Restore only, under prover-ci.yml's `sp1` key: that job owns the
            # cache and saves it on main, and a second save here would store a
            # second copy of the same build directory.
            - name: Restore cargo registry + target
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      prover/target
                  key: ${{ runner.os }}-prover-sp1-${{ env.SP1_VERSION }}-${{ hashFiles('prover/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-prover-sp1-${{ env.SP1_VERSION }}-

            # The release binary, at the path the spec and the deploy read
            # (prover/target/release/sequencer).
            - name: Build the relay
              working-directory: ./prover
              run: cargo build --release --locked -p figaro-sequencer --bin sequencer

            - name: Upload the relay binary
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: devnet-relay
                  path: prover/target/release/sequencer
                  retention-days: 1
                  if-no-files-found: error

    devnet-e2e:
        name: ${{ needs.scope.outputs.scope == 'full' && 'Full devnet suite' || 'Bilateral spine (orders-accept)' }}
        needs: [scope, relay]
        # The relay job is skipped outside the full scope, and this job runs
        # then too; in the full scope it runs only after a relay build that
        # passed.
        if: >-
            ${{ !cancelled()
            && needs.scope.outputs.scope != 'none'
            && (needs.relay.result == 'success' || (needs.scope.outputs.scope != 'full' && needs.relay.result == 'skipped')) }}
        runs-on: ubuntu-24.04
        # The spine: 30 minutes. The full suite: 38 spec files (37 in `devnet`
        # plus the `devnet-authoring` wizard), one worker, one retry per test,
        # about 40 minutes on a laptop; the runner has two cores and builds the
        # export inside the run, so the budget is three times that. The full
        # scope then runs the four `devnet-standalone` specs, which build the
        # export again: 30 minutes more, an estimate no run has measured yet.
        # Either scope then runs the stranger crawl, which builds the export
        # once more and visits every route under a 20-minute test budget: 20
        # minutes more. The full scope's deploy derives the relay's guest
        # fingerprint once, and the batch-events spec starts the relay and
        # lands three batches: 15 minutes more, an estimate no run has
        # measured yet.
        timeout-minutes: ${{ needs.scope.outputs.scope == 'full' && 185 || 50 }}
        env:
            FULL_SUITE: ${{ needs.scope.outputs.scope == 'full' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc

            # ── IPFS (Kubo) — the agreement/branding pin target ──────────
            # Pinned to v0.42.0 (docs/LOCAL_DEV.md: latest 0.40.1 segfaulted in
            # its DHT reprovider). Configure the CORS allowlist for the e2e
            # origins BEFORE the daemon serves pins, then restart — mirrors the
            # manual `figaro-ipfs` container devup expects.
            - name: Start Kubo (IPFS)
              run: |
                  docker run -d --name figaro-ipfs -p 5001:5001 -p 8080:8080 ipfs/kubo:v0.42.0
                  for _ in $(seq 1 60); do
                      if curl -s -X POST http://127.0.0.1:5001/api/v0/version >/dev/null 2>&1; then break; fi
                      sleep 1
                  done
                  docker exec figaro-ipfs ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin \
                      '["http://localhost:3000","http://localhost:3100","http://127.0.0.1:3000","http://127.0.0.1:3100"]'
                  docker exec figaro-ipfs ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods \
                      '["PUT","POST","GET"]'
                  docker restart figaro-ipfs
                  for _ in $(seq 1 60); do
                      if curl -s -X POST http://127.0.0.1:5001/api/v0/version >/dev/null 2>&1; then break; fi
                      sleep 1
                  done
                  curl -s -X POST http://127.0.0.1:5001/api/v0/version

            - name: Build SDK
              run: npm ci --workspace sdk && npm run build --workspace sdk

            - name: Install frontend dependencies
              run: cd frontend && npm ci

            - name: Install Playwright (chromium)
              run: cd frontend && npx playwright install --with-deps chromium

            # ── Chain ────────────────────────────────────────────────────
            # --accounts 47: matches the local stack (devup/deploy-local). The
            # unlocked+funded range must cover every index a spec self-seeds —
            # orders-accept's POS seller is a dedicated wallet at index 31, and
            # a smaller --accounts leaves it with zero ETH for gas. deploy-local's
            # setBalance loop only tops up 10-19; 22-46 rely on launch funding.
            - name: Start Anvil
              run: |
                  anvil --port 8545 --accounts 47 >/tmp/anvil.log 2>&1 &
                  for _ in $(seq 1 60); do
                      if cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
                      sleep 0.5
                  done
                  cast block-number --rpc-url http://127.0.0.1:8545

            # ── Build-time env the static export inlines ─────────────────
            # NEXT_PUBLIC_ENABLE_TEST_HELPERS is read at `next build` time (the
            # webServer builds the export), so it must exist before the deploy
            # appends the contract addresses. deploy-local.sh appends/overwrites
            # keys, creating the file if absent.
            - name: Seed base .env.local
              run: |
                  cat > frontend/.env.local <<'EOF'
                  NEXT_PUBLIC_ENABLE_TEST_HELPERS=true
                  EOF

            # The full scope's relay, where the deploy and the batch-events
            # spec look for it. An artifact keeps no file mode, so the binary
            # is made executable again: the deploy reads the guest fingerprint
            # only from an executable binary. Its first `--vkey` derives the
            # fingerprint (minutes) and caches it for the deploy and the spec.
            - name: Download the relay binary
              if: env.FULL_SUITE == 'true'
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: devnet-relay
                  path: prover/target/release

            - name: Make the relay executable
              if: env.FULL_SUITE == 'true'
              run: |
                  chmod +x prover/target/release/sequencer
                  prover/target/release/sequencer --vkey

            - name: Deploy protocol stack (+ clauses, agreements, reference assemblies)
              run: bash scripts/deploy-local.sh

            # ── The four registry families, on the bare genesis ──────────
            # The walletless registries spec (the `sepolia` project; without
            # E2E_CHAIN it reads the devnet) before any test population: the
            # explorer shows exactly the clauses, agreements, assemblies and
            # members the chain holds, every row's pinned content resolved —
            # the same assertions the Sepolia smoke runs on the public chain.
            - name: Run the four-family registries smoke on the genesis
              run: |
                  cd frontend
                  npx playwright test --project=sepolia registries.sepolia --workers=1
              env:
                  CI: true

            # ── The bilateral spine, end to end ──────────────────────────
            # verify-devnet-deployment (preflight) + populate-test-data (seed,
            # never a test) then the orders-accept spec only. The Playwright
            # `devnet` webServer builds + serves the production static export on
            # :3100; the `devnet-authoring` dependency project sets up the seller.
            - name: Run orders-accept e2e
              if: env.FULL_SUITE != 'true'
              run: |
                  cd frontend
                  node scripts/verify-devnet-deployment.mjs
                  node scripts/populate-test-data.mjs
                  npx playwright test --project=devnet orders-accept.devnet --workers=1
              env:
                  CI: true

            # ── The whole devnet project (the full scope) ────────────────
            # test:e2e:devnet = the same preflight + seed, then every runtime
            # devnet spec after the devnet-authoring wizard, one worker.
            # REQUIRE_BATCH_E2E turns the batch-events spec's skip, when no
            # relay binary is found, into a failure: the binary is provided
            # here, so a skip would pass a run that never read a batched trade.
            - name: Run the full devnet e2e suite
              if: env.FULL_SUITE == 'true'
              run: |
                  cd frontend
                  npm run test:e2e:devnet
              env:
                  CI: true
                  REQUIRE_BATCH_E2E: "1"

            # ── The devnet-standalone project (the full scope) ───────────
            # test:e2e:devnet selects the `devnet` project only. The four
            # self-contained acceptance specs (permissionless-clause,
            # clause-coverage, assembly-withdraw, clause-authoring) live in
            # `devnet-standalone`: each registers its own clause or assembly
            # under a per-run nonce and onboards its own seller, so it pulls
            # no authoring gate. They still need the registered protocol clauses
            # (clause-coverage composes them) and serial use of the anvil
            # accounts they share with the `devnet` specs, so they run here:
            # after the full suite, on the same seeded chain, one worker.
            # The webServer builds the export again (CI reuses no server).
            - name: Run the devnet-standalone project
              if: env.FULL_SUITE == 'true'
              run: |
                  cd frontend
                  npx playwright test --project=devnet-standalone --workers=1
              env:
                  CI: true

            # ── The blind visitor's crawl, either scope ──────────────────
            # The `stranger` project's crawl: no wallet, no test signer, every
            # exported route from `/` and the nav, against the same static
            # export (its webServer builds it again: CI reuses no server) and
            # the seeded chain it reads. Fails on a 404, a console or page
            # error, an empty page, or a wallet-tier page that is only the
            # wallet gate.
            - name: Run the stranger crawl
              run: |
                  cd frontend
                  npx playwright test --project=stranger crawl.stranger --workers=1
              env:
                  CI: true

            # ── The four origination proofs, same live stack ─────────────
            # Autonomous agents (keys only, no browser): in-process channel,
            # real HTTP socket, the A2A interop wire, and the multi-order
            # value-added chain. Each is a full sign/validate/bond/commit
            # cycle landing on the devnet chain; the stack and seed data are
            # the e2e step's (the spine's or the full suite's).
            - name: Run origination proofs
              run: |
                  cd sdk
                  node scripts/verify-origination.devnet.mjs
                  node scripts/verify-origination-http.devnet.mjs
                  node scripts/verify-origination-a2a.devnet.mjs
                  node scripts/verify-origination-chain.devnet.mjs

            # ── The watcher under test, last: it changes the devnet ──────
            # Each alert scripts/monitor-sepolia.mjs promises, produced with
            # real contracts (a florin minter and mint after genesis, a
            # withdrawal burst, FigaroCore short of its open bonds in a
            # rebasing token) and asserted from the watcher's own output; a
            # clean devnet raises nothing, and a record address with no code
            # fails the watch.
            - name: Run the watcher's test
              run: node scripts/test-monitor.mjs

            # The deploy tooling's own tests: no chain, the SDK's build.
            - name: Run the deploy tooling's tests
              run: |
                  node --test scripts/test-verify-etherscan.mjs scripts/test-check-deployment-registrars.mjs \
                      scripts/test-check-deployment-members.mjs scripts/test-propose-gas-constants.mjs \
                      scripts/test-check-release-revision.mjs
                  bash scripts/prover-box/test-checkout-release.sh

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: devnet-playwright-report
                  path: frontend/playwright-report/
                  retention-days: 7

            - name: Anvil log tail on failure
              if: failure()
              run: tail -100 /tmp/anvil.log || true

    # The required check. It reports on every run, so a branch protection rule
    # can require it: a needed job that failed or was canceled fails it; a
    # job skipped by its `if` (the e2e job on a pull request with scope none,
    # the relay job outside the full scope) passes it.
    gate:
        name: devnet-e2e gate
        needs: [scope, relay, devnet-e2e]
        if: always()
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Read the needed jobs' results
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "Needed jobs: $RESULTS"
                  for r in $RESULTS; do
                      case "$r" in
                          failure|cancelled)
                              echo "::error::A needed job ended with $r."
                              exit 1
                              ;;
                      esac
                  done
