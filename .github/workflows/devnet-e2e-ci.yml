name: Devnet E2E CI

# The bilateral spine end-to-end (buyer orders → seller accepts → commit), the
# highest-catch layer, run against a REAL stack in the runner: Anvil + a
# deployed protocol + Kubo (IPFS) + the production static export. Until now this
# layer was maintainer-discipline-only — nothing exercised action→reaction across
# the whole stack on push.
#
# Scope on push and pull request: the `orders-accept` spec (the bilateral
# spine), then the four origination proofs (in-process / HTTP socket / A2A /
# multi-order chain) against the same live stack, then the watcher's test.
#
# Scope on the nightly schedule (and on a dispatch with suite=full): the whole
# Playwright `devnet` project — every runtime *.devnet.spec.ts after its
# `devnet-authoring` dependency — through `npm run test:e2e:devnet`, the same
# command a laptop runs, in place of the spine spec; the proofs and the
# watcher's test follow as on push. One job, one copy of the stack setup: the
# trigger picks the scope.

on:
    # Nightly, 03:37 UTC. GitHub starts this repository's scheduled runs hours
    # after their cron time (five to eight, measured on monitor.yml and
    # estate-snapshot.yml) and may drop one under load; a dispatch with
    # suite=full runs the same scope on demand.
    schedule:
        - cron: "37 3 * * *"
    workflow_dispatch:
        inputs:
            suite:
                description: "spine = the orders-accept spec (the push scope); full = the whole devnet project (the nightly scope)"
                type: choice
                options: [spine, full]
                default: spine
    push:
        branches: [main, develop]
        paths:
            - "src/**"
            - "script/**"
            - "sdk/**"
            - "frontend/**"
            - "clauses/**"
            # The deploy, and what must hold after it (it runs the check).
            - "scripts/deploy-local.sh"
            - "scripts/check-deployment.mjs"
            - "deployments/*.expected.json"
            - "scripts/monitor-sepolia.mjs"
            - "scripts/test-monitor.mjs"
            - ".github/workflows/devnet-e2e-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "src/**"
            - "script/**"
            - "sdk/**"
            - "frontend/**"
            - "clauses/**"
            - "scripts/deploy-local.sh"
            - "scripts/check-deployment.mjs"
            - "deployments/*.expected.json"
            - "scripts/monitor-sepolia.mjs"
            - "scripts/test-monitor.mjs"

permissions:
    contents: read

jobs:
    devnet-e2e:
        name: ${{ (github.event_name == 'schedule' || inputs.suite == 'full') && 'Full devnet suite' || 'Bilateral spine (orders-accept)' }}
        runs-on: ubuntu-latest
        # The spine: 30 minutes. The full suite: 38 spec files (37 in `devnet`
        # plus the `devnet-authoring` wizard), one worker, one retry per test,
        # about 40 minutes on a laptop; the runner has two cores and builds the
        # export inside the run, so the budget is three times that.
        timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.suite == 'full') && 120 || 30 }}
        env:
            FULL_SUITE: ${{ github.event_name == 'schedule' || inputs.suite == 'full' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc

            # ── IPFS (Kubo) — the agreement/branding pin target ──────────
            # Pinned to v0.42.0 (docs/LOCAL_DEV.md: latest 0.40.1 segfaulted in
            # its DHT reprovider). Configure the CORS allowlist for the e2e
            # origins BEFORE the daemon serves pins, then restart — mirrors the
            # manual `figaro-ipfs` container devup expects.
            - name: Start Kubo (IPFS)
              run: |
                  docker run -d --name figaro-ipfs -p 5001:5001 -p 8080:8080 ipfs/kubo:v0.42.0
                  for _ in $(seq 1 60); do
                      if curl -s -X POST http://127.0.0.1:5001/api/v0/version >/dev/null 2>&1; then break; fi
                      sleep 1
                  done
                  docker exec figaro-ipfs ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin \
                      '["http://localhost:3000","http://localhost:3100","http://127.0.0.1:3000","http://127.0.0.1:3100"]'
                  docker exec figaro-ipfs ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods \
                      '["PUT","POST","GET"]'
                  docker restart figaro-ipfs
                  for _ in $(seq 1 60); do
                      if curl -s -X POST http://127.0.0.1:5001/api/v0/version >/dev/null 2>&1; then break; fi
                      sleep 1
                  done
                  curl -s -X POST http://127.0.0.1:5001/api/v0/version

            - name: Build SDK
              run: npm ci --workspace sdk && npm run build --workspace sdk

            - name: Install frontend dependencies
              run: cd frontend && npm ci

            - name: Install Playwright (chromium)
              run: cd frontend && npx playwright install --with-deps chromium

            # ── Chain ────────────────────────────────────────────────────
            # --accounts 38: matches the local stack (devup/deploy-local). The
            # unlocked+funded range must cover every index a spec self-seeds —
            # orders-accept's POS seller is a dedicated wallet at index 31, and
            # a smaller --accounts leaves it with zero ETH for gas. deploy-local's
            # setBalance loop only tops up 10-19; 22-37 rely on launch funding.
            - name: Start Anvil
              run: |
                  anvil --port 8545 --accounts 38 >/tmp/anvil.log 2>&1 &
                  for _ in $(seq 1 60); do
                      if cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
                      sleep 0.5
                  done
                  cast block-number --rpc-url http://127.0.0.1:8545

            # ── Build-time env the static export inlines ─────────────────
            # NEXT_PUBLIC_ENABLE_TEST_HELPERS is read at `next build` time (the
            # webServer builds the export), so it must exist before the deploy
            # appends the contract addresses. deploy-local.sh appends/overwrites
            # keys, creating the file if absent.
            - name: Seed base .env.local
              run: |
                  cat > frontend/.env.local <<'EOF'
                  NEXT_PUBLIC_ENABLE_TEST_HELPERS=true
                  EOF

            - name: Deploy protocol stack (+ pin clauses)
              run: bash scripts/deploy-local.sh

            # ── The bilateral spine, end to end ──────────────────────────
            # verify-devnet-deployment (preflight) + populate-test-data (seed,
            # never a test) then the orders-accept spec only. The Playwright
            # `devnet` webServer builds + serves the production static export on
            # :3100; the `devnet-authoring` dependency project sets up the seller.
            - name: Run orders-accept e2e
              if: env.FULL_SUITE != 'true'
              run: |
                  cd frontend
                  node scripts/verify-devnet-deployment.mjs
                  node scripts/populate-test-data.mjs
                  npx playwright test --project=devnet orders-accept.devnet --workers=1
              env:
                  CI: true

            # ── The whole devnet project (nightly) ───────────────────────
            # test:e2e:devnet = the same preflight + seed, then every runtime
            # devnet spec after the devnet-authoring wizard, one worker.
            - name: Run the full devnet e2e suite
              if: env.FULL_SUITE == 'true'
              run: |
                  cd frontend
                  npm run test:e2e:devnet
              env:
                  CI: true

            # ── The four origination proofs, same live stack ─────────────
            # Autonomous agents (keys only, no browser): in-process channel,
            # real HTTP socket, the A2A interop wire, and the multi-order
            # value-added chain. Each is a full sign/validate/bond/commit
            # cycle landing on the devnet chain; the stack and seed data are
            # the e2e step's (the spine's or the full suite's).
            - name: Run origination proofs
              run: |
                  cd sdk
                  node scripts/verify-origination.devnet.mjs
                  node scripts/verify-origination-http.devnet.mjs
                  node scripts/verify-origination-a2a.devnet.mjs
                  node scripts/verify-origination-chain.devnet.mjs

            # ── The watcher under test, last: it changes the devnet ──────
            # Each alert scripts/monitor-sepolia.mjs promises, produced with
            # real contracts (a florin minter and mint after genesis, a
            # withdrawal burst, FigaroCore short of its open bonds in a
            # rebasing token) and asserted from the watcher's own output; a
            # clean devnet raises nothing, and a record address with no code
            # fails the watch.
            - name: Run the watcher's test
              run: node scripts/test-monitor.mjs

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: devnet-playwright-report
                  path: frontend/playwright-report/
                  retention-days: 7

            - name: Anvil log tail on failure
              if: failure()
              run: tail -100 /tmp/anvil.log || true
