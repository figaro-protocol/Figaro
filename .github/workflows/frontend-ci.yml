name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      # The unit tests read these beside the frontend: the clause specs, the
      # contracts' ABIs, the SDK's source, the deployment records, the
      # reference agreements and assemblies, the builder docs, and the devnet
      # swap venue's source (tests/support/mockSwapVenueAbi.ts).
      - "clauses/**"
      - "abi/**"
      - "sdk/src/**"
      - "deployments/**"
      - "agreements/**"
      - "assemblies/**"
      - "docs-site/**"
      - "src/mocks/MockSwapVenue.sol"
      - ".nvmrc"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      # The unit tests read these beside the frontend: the clause specs, the
      # contracts' ABIs, the SDK's source, the deployment records, the
      # reference agreements and assemblies, the builder docs, and the devnet
      # swap venue's source (tests/support/mockSwapVenueAbi.ts).
      - "clauses/**"
      - "abi/**"
      - "sdk/src/**"
      - "deployments/**"
      - "agreements/**"
      - "assemblies/**"
      - "docs-site/**"
      - "src/mocks/MockSwapVenue.sol"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install workspace root (the file:../sdk link re-runs the sdk prepare-build, which needs the root tree)
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: cd .. && npm ci --workspace sdk && npm run build --workspace sdk

      - name: Run TypeScript type checking
        run: npm run type-check

      # Production mode: source reached only from tests counts as unused.
      - name: Find dead code (knip, production)
        run: npm run knip:prod

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server (background) and wait for readiness
        run: |
          chmod +x ./scripts/start-dev-and-wait.sh
          PORT=3000 WAIT_TIMEOUT=120000 ./scripts/start-dev-and-wait.sh
      - name: Run E2E tests
        run: npm run test:e2e:mobile
        env:
          CI: true
          PORT: 3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # The build's postbuild step typesets every paper's PDF with Tectonic
      # (scripts/build-paper-pdfs.mjs) and fails without it. Release binary,
      # pinned by version and checksum.
      - name: Install Tectonic
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tectonic.tgz" "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  $RUNNER_TEMP/tectonic.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tectonic.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          # A build that is not a deploy: next.config.mjs requires the network named.
          NEXT_PUBLIC_XMTP_ENV: dev

      # Nothing the site ships carries personal information: every text file
      # and every paper PDF of the export just built, scanned by
      # scripts/check-export-no-personal-info.mjs (emails, tokens that carry a
      # personal field). The script reads a PDF's text layer with pypdf, in a
      # virtual environment of its own, pinned by version.
      - name: Scan the static export for personal information
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-text"
          "$RUNNER_TEMP/pdf-text/bin/pip" install --quiet pypdf==6.16.2
          PATH="$RUNNER_TEMP/pdf-text/bin:$PATH" node ../scripts/check-export-no-personal-info.mjs out

      # The export just built, from a clean checkout and public inputs only (no
      # secret is set above), served as any host would serve it: a static file
      # server over frontend/out. A marketing page and an app page must each
      # answer 200 with a body, or the job fails.
      - name: Serve the static export and fetch a marketing page and an app page
        run: |
          node scripts/serve-export.mjs out 3200 > "$RUNNER_TEMP/serve-export.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:3200/ && break
            sleep 1
          done
          for route in / /orders/; do
            code=$(curl -s -o "$RUNNER_TEMP/page.html" -w '%{http_code}' "http://127.0.0.1:3200$route")
            size=$(wc -c < "$RUNNER_TEMP/page.html")
            echo "$route -> HTTP $code, $size bytes"
            if [ "$code" != "200" ] || [ "$size" -eq 0 ]; then
              cat "$RUNNER_TEMP/serve-export.log"
              exit 1
            fi
          done

      # The same export against WCAG 2.0 and 2.1 A and AA: the `stranger`
      # project's accessibility sweep runs axe-core on every route the export
      # ships. E2E_EXPORT_DIR names the export already built, so Playwright's
      # webServer serves frontend/out as it stands and builds nothing; no chain
      # runs here, so each read of the chain leaves its place empty, as it does
      # for a visitor whose read fails.
      - name: Check every exported route for accessibility
        run: npx playwright test --project=stranger accessibility.stranger --workers=1
        env:
          CI: true
          E2E_EXPORT_DIR: out
          PLAYWRIGHT_PORT: 3300

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output
          path: frontend/.next/
          retention-days: 7

  coverage:
    name: Test Coverage
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install workspace root (the file:../sdk link re-runs the sdk prepare-build, which needs the root tree)
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --run

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 14
