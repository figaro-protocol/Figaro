name: Guards CI

# The whole-tree guard battery. Unlike the language-scoped workflows this is NOT
# path-filtered: the guards are repo-wide (they span *.ts/*.tsx/*.sol/*.md,
# clauses/, scripts/, docs/, certora/, formal/), and lint-staged only ever sees a
# commit's touched files — so a guard added or tightened after a file last
# changed never re-inspects it. This job re-certifies the whole tree on every
# push/PR. (prover-ci.yml exists again — restored 2026-08-04 after the
# witness-based prover rebuild; it covers the SP1-free prover crates.)

on:
    workflow_dispatch:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    battery:
        name: Whole-tree guard battery
        runs-on: ubuntu-latest
        env:
            # Present only if the repo/org sets the secret; the semantic step is
            # skipped when it is empty (see its `if:`), so this is never required.
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  # Full history so the optional semantic gate can diff against the base ref.
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
                  cache-dependency-path: |
                      package-lock.json
                      frontend/package-lock.json

            # verify-guards.sh needs sdk/dist (knip/tsc resolve @figaro-protocol/sdk) and
            # both workspaces' node_modules. Build the SDK before installing the
            # frontend, which consumes it via file:../sdk.
            - name: Install + build SDK
              run: npm ci --workspace sdk && npm run build --workspace sdk

            - name: Install frontend
              run: cd frontend && npm ci

            # Production-dependency supply-chain gate. `--omit=dev` scopes to
            # what actually ships. Root gates at high+ (currently 0 — this leg
            # protects the published SDK). The frontend leg gates at CRITICAL
            # only: its two standing high advisories live in the
            # `next`/bundled-`postcss` tree, major-only fix, tracked as an
            # accepted non-blocking risk in docs/RELEASE_READINESS.md Task 7.2
            # (static export ships no Next server — build-host hygiene, not a
            # runtime exposure). Raise frontend back to high+ when the Next
            # major lands; do NOT silently soften root.
            - name: npm audit — root (production deps, high+)
              run: npm audit --omit=dev --audit-level=high

            - name: npm audit — frontend (production deps, critical only — see comment)
              run: cd frontend && npm audit --omit=dev --audit-level=critical

            - name: Run whole-tree guard battery
              run: bash scripts/verify-guards.sh

            # The semantic open-world gate is a reasoning-agent audit of the diff.
            # It is OPTIONAL and never a hard dependency: skipped entirely without
            # the secret, and its runner (scripts/semantic-precommit-audit.sh)
            # fail-opens if the Claude CLI is unavailable or errors — so a genuine
            # FAIL verdict blocks, but missing infra never does.
            - name: Semantic open-world gate (optional; needs ANTHROPIC_API_KEY)
              if: ${{ env.ANTHROPIC_API_KEY != '' }}
              run: |
                  npm i -g @anthropic-ai/claude-code \
                      || echo "claude CLI unavailable — semantic gate will fail-open"
                  # The audit is diff-only (reads the staged set); stage the PR/push
                  # diff so it has content to judge.
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
                      BASE="origin/${{ github.base_ref }}"
                  else
                      BASE="HEAD~1"
                  fi
                  git diff --name-only "$BASE"...HEAD 2>/dev/null | xargs -r git add -- 2>/dev/null || true
                  # The auditor prompts are maintainer-private (not in the public
                  # tree); the gate runs only where a checkout carries them.
                  if [ -f .claude/agents/figaro-open-world-auditor.md ]; then
                      bash scripts/semantic-precommit-audit.sh frontend '^frontend/.*\.tsx?$' .claude/agents/figaro-open-world-auditor.md
                      bash scripts/semantic-precommit-audit.sh protocol '^(src/.*\.sol|prover/.*\.rs)$' .claude/agents/figaro-protocol-open-world-auditor.md
                  else
                      echo "semantic gate skipped — auditor prompts are maintainer-private and absent from this checkout"
                  fi
