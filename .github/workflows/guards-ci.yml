name: Dependency Audit CI

# Production-dependency supply-chain gate over both lockfiles. (The maintainers'
# whole-tree guard battery and semantic gate run pre-commit on the build side of
# the tooling seam and are not part of the public tree.)

on:
    workflow_dispatch:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    audit:
        name: npm audit (production deps)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc

            # `--omit=dev` scopes to what actually ships. Root gates at high+
            # (protects the published SDK). The frontend leg gates at CRITICAL
            # only: its two standing high advisories live in the
            # `next`/bundled-`postcss` tree, major-only fix, tracked as an
            # accepted non-blocking risk in docs/RELEASE_READINESS.md Task 7.2
            # (static export ships no Next server — build-host hygiene, not a
            # runtime exposure). Raise frontend back to high+ when the Next
            # major lands; do NOT silently soften root.
            - name: npm audit — root (production deps, high+)
              run: npm audit --omit=dev --audit-level=high

            - name: npm audit — frontend (production deps, critical only — see comment)
              run: cd frontend && npm audit --omit=dev --audit-level=critical
