name: Dependency Audit CI

# Production-dependency supply-chain gate over the four lockfiles: the three npm
# ones and the prover workspace's Cargo.lock. (The maintainers' whole-tree guard
# battery and semantic gate run pre-commit on the build side of the tooling seam
# and are not part of the public tree.)

on:
    workflow_dispatch:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

env:
    CARGO_AUDIT_VERSION: "0.22.2"

jobs:
    audit:
        name: npm audit (production deps)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc

            # `--omit=dev` scopes to what actually ships. Root and frontend both
            # gate at high+: root protects the published SDK; the frontend leg
            # runs through scripts/audit-frontend.mjs, which fails on every high
            # or critical advisory except one that cannot reach a static export
            # and is set aside by id, with its reason, in
            # frontend/.audit-ignore.json. Do NOT silently soften either leg.
            - name: npm audit — root (production deps, high+)
              run: npm audit --omit=dev --audit-level=high

            - name: npm audit — frontend (production deps, high+, static-export advisories set aside — see comment)
              run: node scripts/audit-frontend.mjs

            # The docs site (/docs) is its own static export with its own
            # lockfile, served from the wallet app's origin: its scripts run
            # with the same reach as the signing pages. This leg gates at
            # critical, below the frontend's high: `npm audit --omit=dev
            # --audit-level=high` in docs-site fails on one high, zod 4.5.4
            # (GHSA-mrhx-c7xc-m3w5), whose fix (4.6.6 or later) is outside the
            # exact version docs-site/package.json pins. The gate moves to high
            # when that pin moves.
            - name: npm audit — docs-site (production deps, critical only)
              working-directory: ./docs-site
              run: npm audit --omit=dev --audit-level=critical

    cargo-audit:
        name: cargo audit (prover workspace)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            # The same pin the sequencer release builds with — one source of
            # truth for the host toolchain (prover/rust-toolchain.toml).
            - name: Pinned Rust toolchain
              uses: ./.github/actions/rust-toolchain

            # cargo-audit is built from source once per version and cached; a
            # cache hit makes this leg a lockfile read.
            - name: Cache cargo-audit
              id: cache-cargo-audit
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/bin/cargo-audit
                  key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}

            - name: Install cargo-audit ${{ env.CARGO_AUDIT_VERSION }}
              if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
              run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

            # Fails on any advisory with a vulnerability against a crate in
            # prover/Cargo.lock; unmaintained and yanked notices print as
            # warnings. The lockfile is audited as committed (--locked is the
            # build's discipline too), never re-resolved here.
            - name: cargo audit — prover/Cargo.lock
              working-directory: ./prover
              run: cargo audit --file Cargo.lock
