name: Dependency Audit CI

# Production-dependency supply-chain gate over the three lockfiles: the two npm
# ones and the prover workspace's Cargo.lock. (The maintainers' whole-tree guard
# battery and semantic gate run pre-commit on the build side of the tooling seam
# and are not part of the public tree.)

on:
    workflow_dispatch:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

env:
    CARGO_AUDIT_VERSION: "0.22.2"

jobs:
    audit:
        name: npm audit (production deps)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc

            # `--omit=dev` scopes to what actually ships. Root gates at high+
            # (protects the published SDK). The frontend leg gates at CRITICAL
            # only: its two standing high advisories live in the
            # `next`/bundled-`postcss` tree, major-only fix, tracked as an
            # accepted non-blocking risk in docs/RELEASE_READINESS.md Task 7.2
            # (static export ships no Next server — build-host hygiene, not a
            # runtime exposure). A CRITICAL advisory that cannot reach a static
            # export is set aside by id, with its reason, in
            # frontend/.audit-ignore.json (read by scripts/audit-frontend.mjs);
            # anything else critical still fails. Raise frontend back to high+
            # when the Next major lands; do NOT silently soften root.
            - name: npm audit — root (production deps, high+)
              run: npm audit --omit=dev --audit-level=high

            - name: npm audit — frontend (production deps, critical only, static-export advisories set aside — see comment)
              run: node scripts/audit-frontend.mjs

    cargo-audit:
        name: cargo audit (prover workspace)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            # The same pin the sequencer release builds with — one source of
            # truth for the host toolchain (prover/rust-toolchain.toml).
            - name: Read pinned Rust toolchain
              run: |
                  RUST_TOOLCHAIN=$(awk -F'"' '/^channel/{print $2}' prover/rust-toolchain.toml)
                  if [ -z "$RUST_TOOLCHAIN" ]; then
                      echo "could not read channel from prover/rust-toolchain.toml"
                      exit 1
                  fi
                  echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

            - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
              run: |
                  rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
                  rustup default "$RUST_TOOLCHAIN"

            # cargo-audit is built from source once per version and cached; a
            # cache hit makes this leg a lockfile read.
            - name: Cache cargo-audit
              id: cache-cargo-audit
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/bin/cargo-audit
                  key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}

            - name: Install cargo-audit ${{ env.CARGO_AUDIT_VERSION }}
              if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
              run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

            # Fails on any advisory with a vulnerability against a crate in
            # prover/Cargo.lock; unmaintained and yanked notices print as
            # warnings. The lockfile is audited as committed (--locked is the
            # build's discipline too), never re-resolved here.
            - name: cargo audit — prover/Cargo.lock
              working-directory: ./prover
              run: cargo audit --file Cargo.lock
