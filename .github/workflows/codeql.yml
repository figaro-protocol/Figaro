name: CodeQL

# Code scanning in advanced setup, the default setup's languages and query suite,
# with one difference: rust/hard-coded-cryptographic-value is filtered off the
# prover's test directories. Their fixtures hash fixed inputs on purpose (a
# clause's bytes, an agreement, an operation id); the rule still scans every
# shipped crate, and every other rule still scans the tests.

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "17 4 * * 1"

permissions:
    contents: read

jobs:
    analyze:
        name: CodeQL (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript, rust]
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Initialize CodeQL
              uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: default

            - name: Analyze
              uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  category: /language:${{ matrix.language }}
                  upload: never
                  output: sarif-results

            # One language per job, so one SARIF file, whatever name the
            # analysis gives it (javascript-typescript writes javascript.sarif).
            - name: Name the results file
              run: |
                  set -euo pipefail
                  files=(sarif-results/*.sarif)
                  [ "${#files[@]}" -eq 1 ] || { echo "expected one SARIF file, found ${#files[@]}"; exit 1; }
                  mv "${files[0]}" sarif-results/results.sarif

            - name: Filter the test fixtures' hard-coded values
              uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
              with:
                  patterns: |
                      -prover/**/tests/**:rust/hard-coded-cryptographic-value
                  input: sarif-results/results.sarif
                  output: sarif-results/results.sarif

            - name: Upload
              uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  sarif_file: sarif-results/results.sarif
                  category: /language:${{ matrix.language }}
