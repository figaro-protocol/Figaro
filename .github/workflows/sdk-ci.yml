name: SDK CI

on:
    workflow_dispatch:
    push:
        branches: [main, develop]
        paths:
            - "sdk/**"
            # The freshness gate diffs the committed typedoc regen — a commit
            # that only updates the regen must re-run the gate that failed it.
            - "frontend/public/sdk-api/**"
            - ".github/workflows/sdk-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "sdk/**"
            - "frontend/public/sdk-api/**"

permissions:
    contents: read

jobs:
    test:
        name: SDK Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            # sdk/ is an npm workspace of the root package.json with no own
            # lockfile — install from the root against the committed
            # package-lock.json, scoped to the sdk workspace.
            - name: Install dependencies
              run: npm ci --workspace sdk

            - name: Run TypeScript type checking
              working-directory: ./sdk
              run: npm run lint

            - name: Run tests
              working-directory: ./sdk
              run: npm test -- --run

            - name: Build
              working-directory: ./sdk
              run: npm run build

            # The tracked API reference (frontend/public/sdk-api) must equal
            # what typedoc emits from this source — it drifted silently before
            # the 2026-08-24 audit. typedoc.json pins gitRevision to "main" so
            # the output is deterministic and this diff is meaningful.
            - name: API reference freshness (typedoc)
              working-directory: ./sdk
              run: |
                  npm run docs
                  git diff --exit-code --stat -- ../frontend/public/sdk-api \
                    || { echo "frontend/public/sdk-api is stale — run 'cd sdk && npm run docs' and commit the regen"; exit 1; }
