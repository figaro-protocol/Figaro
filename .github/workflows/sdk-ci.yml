name: SDK CI

on:
    push:
        branches: [main, develop]
        paths:
            - "sdk/**"
            - ".github/workflows/sdk-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "sdk/**"

permissions:
    contents: read

jobs:
    test:
        name: SDK Test & Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            # sdk/ is an npm workspace of the root package.json with no own
            # lockfile — install from the root against the committed
            # package-lock.json, scoped to the sdk workspace.
            - name: Install dependencies
              run: npm ci --workspace sdk

            - name: Run TypeScript type checking
              working-directory: ./sdk
              run: npm run lint

            - name: Run tests
              working-directory: ./sdk
              run: npm test -- --run

            - name: Build
              working-directory: ./sdk
              run: npm run build
