name: Prover CI

# Runs `cargo test` for the prover workspace (see prover/Cargo.toml).
#
# Two jobs, two costs.
#
# `test` — every push and PR: the one crate that builds and tests WITHOUT the
# SP1 toolchain, `figaro-kernel` (prover/lib). It has no build.rs and no sp1-*
# deps (it depends on alloy-primitives, serde and k256 — see
# prover/lib/Cargo.toml), so `cargo test` on it exercises the mirror of
# FigaroCore without the guest-program toolchain tax.
#
# `test` also runs the static analysis: clippy with its correctness and
# suspicious groups denied, and Semgrep's Rust ruleset failing on any WARNING
# or ERROR. The `sp1` job runs clippy over the two crates it builds.
#
# `cross-impl-fuzz` — every push and PR: the differential fuzz across the
# implementations (scripts/test-cross-impl-fuzz.sh). Foundry runs a seeded
# stream of operations on FigaroCore and figaro-kernel replays it; the SDK
# generates agreements and both Merkle verifiers open their proofs. The seed
# is the run id, so every run draws new streams, and the log prints it.
#
# `sp1` — every push to main, every dispatch, and every PR that touches the
# proof program, the relay, the Core or a contract the batch e2e deploys: the
# other three workspace members —
# `figaro-prover` (prover/program, the SP1 guest), `figaro-prove-test`
# (prover/script) and `figaro-sequencer` (prover/sequencer) — pull in
# `sp1-build`/`sp1-zkvm`/`sp1-sdk`, and their `build.rs` calls
# `sp1_build::build_program`, which needs `cargo prove` (the SP1 toolchain) to
# cross-compile the guest ELF to RISC-V. That job installs the toolchain the
# way `.github/workflows/sequencer-release.yml` does, runs the sequencer and
# guest test suites, then runs the SDK's chain selection (`npm run test:chain`'s
# files): the four-layer batch e2e (TypeScript signs, the Rust sequencer
# proves and submits, the Solidity verifier settles on a live Anvil) and the
# SDK's round-trip on that Anvil. A missing chain or binary fails each file.
# The PR trigger's paths are the narrower list below: a change to the relay or
# to what it proves is tested before it merges, and a PR that touches only the
# SDK or a document does not pay the toolchain's cost.

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "prover/**"
            - "src/core/kernel/**"
            - "src/core/attestation/**"
            - "src/core/verifier/**"
            - "test/core/kernel/KernelDifferentialFuzzTest.t.sol"
            - "test/core/attestation/MerkleParityTest.t.sol"
            - "sdk/src/agreement.ts"
            - "sdk/src/clauses/**"
            - "sdk/tests/merkleParity.test.ts"
            - "clauses/**"
            - "test/fixtures/clause-keys.json"
            - "scripts/test-cross-impl-fuzz.sh"
            - "fuzz/prover/**"
            - "test/fixtures/operation-stream-vectors.json"
            - "test/fixtures/public-values-vectors.json"
            - ".github/workflows/prover-ci.yml"
            # What the `sp1` job's chain step reads: its five test files, the
            # harness they share and the config that selects them; the SDK it
            # builds and imports; the contracts the harness
            # deploys from out/ (the Core's above, the four registries, the
            # counter and two mocks) and the build settings behind out/; the
            # dependencies `npm ci` installs.
            - "sdk/tests/batch-e2e.test.ts"
            - "sdk/tests/batch-revoke-e2e.test.ts"
            - "sdk/tests/batch-accrual-skip-e2e.test.ts"
            - "sdk/tests/batch-traces-e2e.test.ts"
            - "sdk/tests/integration.test.ts"
            - "sdk/tests/batchHarness.ts"
            - "sdk/vitest.chain.config.ts"
            - "sdk/src/**"
            - "sdk/package.json"
            - "sdk/tsconfig.json"
            - "package-lock.json"
            - "src/registries/**"
            - "src/rewards/UsageCounter.sol"
            - "src/mocks/MockERC20.sol"
            - "src/mocks/MockSP1Verifier.sol"
            - "foundry.toml"
    pull_request:
        branches: [main]
        paths:
            - "prover/**"
            - "src/core/kernel/**"
            - "src/core/attestation/**"
            - "src/core/verifier/**"
            - "test/core/kernel/KernelDifferentialFuzzTest.t.sol"
            - "test/core/attestation/MerkleParityTest.t.sol"
            - "sdk/src/agreement.ts"
            - "sdk/src/clauses/**"
            - "sdk/tests/merkleParity.test.ts"
            - "clauses/**"
            - "test/fixtures/clause-keys.json"
            - "scripts/test-cross-impl-fuzz.sh"
            - "fuzz/prover/**"
            - "test/fixtures/operation-stream-vectors.json"
            - "test/fixtures/public-values-vectors.json"
            # The contracts the `sp1` job's batch e2e deploys beside the Core.
            - "src/registries/**"
            - "src/rewards/UsageCounter.sol"
            - ".github/workflows/prover-ci.yml"

permissions:
    contents: read

jobs:
    test:
        name: cargo test (figaro-kernel)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            # Single source of truth, same read as sequencer-release.yml's
            # "Pinned Rust toolchain" step — prover/rust-toolchain.toml
            # is pinned to the host toolchain the guest ELF (and therefore
            # the SP1 verification key) was built against.
            - name: Pinned Rust toolchain
              uses: ./.github/actions/rust-toolchain

            - name: Cache cargo registry + target
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      prover/target
                  key: ${{ runner.os }}-prover-cargo-${{ hashFiles('prover/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-prover-cargo-

            - name: cargo test (figaro-kernel)
              working-directory: ./prover
              run: cargo test --locked -p figaro-kernel

            # Static analysis over the guest's crate. Clippy's correctness
            # and suspicious groups are denied; its style groups are printed,
            # not gated. Semgrep's Rust ruleset fails on any WARNING or ERROR
            # (--error), over every crate in scope, the relay included.
            - name: Install clippy
              run: rustup component add clippy --toolchain "$RUST_TOOLCHAIN"

            - name: cargo clippy (figaro-kernel)
              working-directory: ./prover
              run: >-
                  cargo clippy --locked -p figaro-kernel --all-targets --features cross-impl-fuzz
                  -- -D clippy::correctness -D clippy::suspicious

            - name: Install Semgrep
              run: pipx install semgrep==1.176.1

            - name: Run Semgrep (Rust)
              run: >-
                  semgrep --config p/rust --error --severity ERROR --severity WARNING
                  prover/program/src prover/lib/src prover/sequencer/src

    cross-impl-fuzz:
        name: differential fuzz (FigaroCore, agreement tree)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Pinned Rust toolchain
              uses: ./.github/actions/rust-toolchain

            - name: Install Foundry
              uses: ./.github/actions/foundry

            - name: Cache cargo registry + target
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      prover/target
                  key: ${{ runner.os }}-prover-cargo-${{ hashFiles('prover/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-prover-cargo-

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install the SDK
              run: npm ci --workspace sdk

            - name: Differential fuzz, four rounds from the run id
              env:
                  FUZZ_ROUNDS: "4"
              run: ./scripts/test-cross-impl-fuzz.sh "${{ github.run_id }}"

    # The decoder of the operation stream over arbitrary bytes: no panic, and
    # every stream it accepts encodes again to the same bytes
    # (fuzz/prover/fuzz_targets/operation_stream.rs). libFuzzer needs a nightly
    # compiler; the date is pinned so two runs build with one compiler. The
    # corpus starts from the encoder's own vectors. The run is bounded in time,
    # so it samples; a crash input is uploaded and fails the job.
    decoder-fuzz:
        name: cargo fuzz (operation stream decoder)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            FUZZ_NIGHTLY: nightly-2026-11-15
            CARGO_FUZZ_VERSION: 0.13.2
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Install the nightly compiler and cargo-fuzz
              run: |
                  rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
                  cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"

            - name: Seed the corpus from the encoder's vectors
              run: python3 -I fuzz/prover/seed.py

            - name: cargo fuzz run operation_stream, five minutes
              run: |
                  set -uo pipefail
                  cargo +"$FUZZ_NIGHTLY" fuzz run operation_stream --fuzz-dir fuzz/prover -- -max_total_time=300 > "$RUNNER_TEMP/fuzz.log" 2>&1
                  code=$?
                  tail -15 "$RUNNER_TEMP/fuzz.log"
                  grep -q "Done [0-9]* runs" "$RUNNER_TEMP/fuzz.log" || { echo "::error::the run did not report its end"; exit 1; }
                  if [ -n "$(ls -A fuzz/prover/artifacts/operation_stream 2>/dev/null)" ]; then echo "::error::the fuzzer saved a crash input"; exit 1; fi
                  exit "$code"

            - name: Upload a crash input
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: decoder-fuzz-artifacts
                  path: fuzz/prover/artifacts
                  if-no-files-found: ignore

    sp1:
        name: SP1 crates + batch e2e
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Pinned Rust toolchain
              uses: ./.github/actions/rust-toolchain

            # The SP1 release is the lock's sp1-sdk version — the same read
            # sequencer-release.yml makes, so the toolchain and the library
            # the guest compiles against are one release.
            # Same bootstrap as sequencer-release.yml: the sp1up script is
            # fetched rather than piped into bash because it exits when it
            # cannot edit an interactive shell profile — the CI case.
            - name: Pinned SP1 release and its toolchain
              uses: ./.github/actions/sp1

            - name: Install protoc
              uses: ./.github/actions/protoc

            - name: Cache cargo registry + target
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      prover/target
                  key: ${{ runner.os }}-prover-sp1-${{ env.SP1_VERSION }}-${{ hashFiles('prover/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-prover-sp1-${{ env.SP1_VERSION }}-

            # The release binary is what the batch e2e launches
            # (sdk/tests/batch-e2e.test.ts: prover/target/release/sequencer):
            # SP1's key setup runs inside it at startup and for `--vkey`,
            # seconds optimized and the better part of an hour unoptimized.
            - name: Build the sequencer
              working-directory: ./prover
              run: cargo build --release --locked -p figaro-sequencer --bin sequencer

            - name: cargo clippy (figaro-sequencer, figaro-prove-test)
              working-directory: ./prover
              run: |
                  rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
                  cargo clippy --locked -p figaro-sequencer -p figaro-prove-test --all-targets -- -D clippy::correctness -D clippy::suspicious

            - name: cargo test (figaro-sequencer, figaro-prove-test)
              working-directory: ./prover
              run: cargo test --locked -p figaro-sequencer -p figaro-prove-test

            - name: Install Foundry
              uses: ./.github/actions/foundry

            # The e2e deploys the contracts itself, from the bytecode Foundry
            # writes to out/ — so the contracts are built here, the way a
            # developer's checkout has them built.
            - name: forge build
              run: forge build

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install + build the SDK
              run: npm ci --workspace sdk && npm run build --workspace sdk

            - name: Start Anvil
              run: |
                  anvil --port 8545 >/tmp/anvil.log 2>&1 &
                  for i in $(seq 1 30); do
                      if curl -sf -X POST -H 'content-type: application/json' \
                          --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                          http://127.0.0.1:8545 >/dev/null; then
                          echo "anvil up"; exit 0
                      fi
                      sleep 1
                  done
                  echo "anvil did not come up"; cat /tmp/anvil.log; exit 1

            # The chain selection (sdk/vitest.chain.config.ts): the SDK's
            # round-trip on this Anvil, then the batch e2e (SDK → sequencer →
            # verifier). Each file fails, never skips, when the chain or the
            # binary is missing. The round-trip deploys its own token and Core
            # and the batch files their own stacks, so the order holds no state.
            - name: SDK chain tests (round-trip, batch e2e)
              working-directory: ./sdk
              # One vitest process per file: run together in one process, the runner
              # is shut down about three minutes in, while each file passes alone.
              # `set -e` fails the step at the first file that fails.
              run: |
                  set -e
                  npm run test:chain -- tests/integration.test.ts
                  npm run test:chain -- tests/batch-e2e.test.ts
                  npm run test:chain -- tests/batch-revoke-e2e.test.ts
                  npm run test:chain -- tests/batch-accrual-skip-e2e.test.ts
                  npm run test:chain -- tests/batch-traces-e2e.test.ts

            - name: Anvil log on failure
              if: failure()
              run: tail -100 /tmp/anvil.log || true
