name: Prover CI

# Runs `cargo test` for the prover workspace (see prover/Cargo.toml).
#
# Two jobs, two costs.
#
# `test` — every push and PR: the two crates that build and test WITHOUT the
# SP1 toolchain, `figaro-clause` (prover/clause) and `figaro-kernel`
# (prover/lib). They have no build.rs and no sp1-* deps (figaro-kernel depends
# on figaro-clause, alloy-primitives, k256 — see prover/lib/Cargo.toml and
# prover/clause/Cargo.toml), so `cargo test` on just those two exercises the
# Layer-B clause-validation mirror and the mirror of FigaroCore without the
# guest-program toolchain tax.
#
# `test` also runs the static analysis: clippy with its correctness and
# suspicious groups denied, and Semgrep's Rust ruleset failing on any WARNING
# or ERROR. The `sp1` job runs clippy over the two crates it builds.
#
# `cross-impl-fuzz` — every push and PR: the differential fuzz across the
# implementations (scripts/test-cross-impl-fuzz.sh). Foundry runs a seeded
# stream of operations on FigaroCore and figaro-kernel replays it; the SDK
# generates agreements and both Merkle verifiers open their proofs; the SDK
# draws clause cases and the guest's engine gives the same answers. The seed
# is the run id, so every run draws new streams, and the log prints it.
#
# `sp1` — push to main and dispatch only: the other three workspace members —
# `figaro-prover` (prover/program, the SP1 guest), `figaro-prove-test`
# (prover/script) and `figaro-sequencer` (prover/sequencer) — pull in
# `sp1-build`/`sp1-zkvm`/`sp1-sdk`, and their `build.rs` calls
# `sp1_build::build_program`, which needs `cargo prove` (the SP1 toolchain) to
# cross-compile the guest ELF to RISC-V. That job installs the toolchain the
# way `.github/workflows/sequencer-release.yml` does, runs the sequencer and
# guest test suites, then runs the SDK's four-layer batch e2e (TypeScript
# signs, the Rust sequencer proves and submits, the Solidity verifier settles
# on a live Anvil) with its skip turned into a failure. Paying that cost on
# every PR is what the split avoids.

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "prover/**"
            - "test/core/kernel/KernelDifferentialFuzzTest.t.sol"
            - "test/core/attestation/MerkleParityTest.t.sol"
            - "sdk/src/agreement.ts"
            - "sdk/src/clauses/**"
            - "sdk/tests/merkleParity.test.ts"
            - "sdk/tests/clauses/clauseFuzzVectors.test.ts"
            - "clauses/**"
            - "scripts/test-cross-impl-fuzz.sh"
            - ".github/workflows/prover-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "prover/**"
            - "test/core/kernel/KernelDifferentialFuzzTest.t.sol"
            - "test/core/attestation/MerkleParityTest.t.sol"
            - "sdk/src/agreement.ts"
            - "sdk/src/clauses/**"
            - "sdk/tests/merkleParity.test.ts"
            - "sdk/tests/clauses/clauseFuzzVectors.test.ts"
            - "clauses/**"
            - "scripts/test-cross-impl-fuzz.sh"

permissions:
    contents: read

jobs:
    test:
        name: cargo test (figaro-clause, figaro-kernel)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            # Single source of truth, same read as sequencer-release.yml's
            # "Read pinned Rust toolchain" step — prover/rust-toolchain.toml
            # is pinned to the host toolchain the guest ELF (and therefore
            # the SP1 verification key) was built against.
            - name: Read pinned Rust toolchain
              id: toolchain
              run: |
                  RUST_TOOLCHAIN=$(awk -F'"' '/^channel/{print $2}' prover/rust-toolchain.toml)
                  if [ -z "$RUST_TOOLCHAIN" ]; then
                      echo "could not read channel from prover/rust-toolchain.toml"
                      exit 1
                  fi
                  echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
                  echo "pinned Rust toolchain: $RUST_TOOLCHAIN"

            - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
              run: |
                  rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
                  rustup default "$RUST_TOOLCHAIN"
                  rustc --version

            - name: Cache cargo registry + target
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      prover/target
                  key: ${{ runner.os }}-prover-cargo-${{ hashFiles('prover/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-prover-cargo-

            - name: cargo test (figaro-clause, figaro-kernel)
              working-directory: ./prover
              run: cargo test --locked -p figaro-clause -p figaro-kernel

            # Static analysis over the guest's two crates. Clippy's correctness
            # and suspicious groups are denied; its style groups are printed,
            # not gated. Semgrep's Rust ruleset fails on any WARNING or ERROR
            # (--error), over every crate in scope, the relay included.
            - name: Install clippy
              run: rustup component add clippy --toolchain "$RUST_TOOLCHAIN"

            - name: cargo clippy (figaro-clause, figaro-kernel)
              working-directory: ./prover
              run: >-
                  cargo clippy --locked -p figaro-clause -p figaro-kernel --all-targets
                  -- -D clippy::correctness -D clippy::suspicious

            - name: Install Semgrep
              run: pipx install semgrep==1.176.1

            - name: Run Semgrep (Rust)
              run: >-
                  semgrep --config p/rust --error --severity ERROR --severity WARNING
                  prover/program/src prover/lib/src prover/clause/src prover/sequencer/src

    cross-impl-fuzz:
        name: differential fuzz (FigaroCore, agreement tree, clause engine)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Read pinned Rust toolchain
              run: |
                  RUST_TOOLCHAIN=$(awk -F'"' '/^channel/{print $2}' prover/rust-toolchain.toml)
                  if [ -z "$RUST_TOOLCHAIN" ]; then
                      echo "could not read channel from prover/rust-toolchain.toml"
                      exit 1
                  fi
                  echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

            - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
              run: |
                  rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
                  rustup default "$RUST_TOOLCHAIN"

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Cache cargo registry + target
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      prover/target
                  key: ${{ runner.os }}-prover-cargo-${{ hashFiles('prover/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-prover-cargo-

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install the SDK
              run: npm ci --workspace sdk

            - name: Differential fuzz, four rounds from the run id
              env:
                  FUZZ_ROUNDS: "4"
              run: ./scripts/test-cross-impl-fuzz.sh "${{ github.run_id }}"

    sp1:
        name: SP1 crates + batch e2e (main only)
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Read pinned Rust toolchain
              run: |
                  RUST_TOOLCHAIN=$(awk -F'"' '/^channel/{print $2}' prover/rust-toolchain.toml)
                  if [ -z "$RUST_TOOLCHAIN" ]; then
                      echo "could not read channel from prover/rust-toolchain.toml"
                      exit 1
                  fi
                  echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

            - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
              run: |
                  rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
                  rustup default "$RUST_TOOLCHAIN"
                  rustc --version

            # The SP1 release is the lock's sp1-sdk version — the same read
            # sequencer-release.yml makes, so the toolchain and the library
            # the guest compiles against are one release.
            - name: Read pinned SP1 version
              run: |
                  SP1_VERSION=v$(awk '/^name = "sp1-sdk"$/{getline; gsub(/version = |"/, ""); print; exit}' prover/Cargo.lock)
                  if [ "$SP1_VERSION" = "v" ]; then
                      echo "could not read the sp1-sdk version from prover/Cargo.lock"
                      exit 1
                  fi
                  echo "SP1_VERSION=$SP1_VERSION" >> "$GITHUB_ENV"

            # Same bootstrap as sequencer-release.yml: the sp1up script is
            # fetched rather than piped into bash because it exits when it
            # cannot edit an interactive shell profile — the CI case.
            - name: Install SP1 ${{ env.SP1_VERSION }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p "$HOME/.sp1/bin"
                  # The installer script at the locked release's tag, never
                  # `main`: the same pin sequencer-release.yml uses beside
                  # its signing identity, so this job proves the pinned script.
                  curl -sSfL "https://raw.githubusercontent.com/succinctlabs/sp1/${SP1_VERSION}/sp1up/sp1up" \
                      -o "$HOME/.sp1/bin/sp1up"
                  chmod +x "$HOME/.sp1/bin/sp1up"
                  "$HOME/.sp1/bin/sp1up" --version "$SP1_VERSION"
                  echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

            - name: Install protoc
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
                  protoc --version

            - name: Cache cargo registry + target
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      prover/target
                  key: ${{ runner.os }}-prover-sp1-${{ env.SP1_VERSION }}-${{ hashFiles('prover/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-prover-sp1-${{ env.SP1_VERSION }}-

            # The release binary is what the batch e2e launches
            # (sdk/tests/batch-e2e.test.ts: prover/target/release/sequencer):
            # SP1's key setup runs inside it at startup and for `--vkey`,
            # seconds optimized and the better part of an hour unoptimized.
            - name: Build the sequencer
              working-directory: ./prover
              run: cargo build --release --locked -p figaro-sequencer --bin sequencer

            - name: cargo clippy (figaro-sequencer, figaro-prove-test)
              working-directory: ./prover
              run: |
                  rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
                  cargo clippy --locked -p figaro-sequencer -p figaro-prove-test --all-targets -- -D clippy::correctness -D clippy::suspicious

            - name: cargo test (figaro-sequencer, figaro-prove-test)
              working-directory: ./prover
              run: cargo test --locked -p figaro-sequencer -p figaro-prove-test

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            # The e2e deploys the contracts itself, from the bytecode Foundry
            # writes to out/ — so the contracts are built here, the way a
            # developer's checkout has them built.
            - name: forge build
              run: forge build

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install + build the SDK
              run: npm ci --workspace sdk && npm run build --workspace sdk

            - name: Start Anvil
              run: |
                  anvil --port 8545 >/tmp/anvil.log 2>&1 &
                  for i in $(seq 1 30); do
                      if curl -sf -X POST -H 'content-type: application/json' \
                          --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                          http://127.0.0.1:8545 >/dev/null; then
                          echo "anvil up"; exit 0
                      fi
                      sleep 1
                  done
                  echo "anvil did not come up"; cat /tmp/anvil.log; exit 1

            # REQUIRE_BATCH_E2E turns the spec's two prerequisite checks from
            # skips into failures: here the binary and the chain are both
            # provided, so a skip would be a silent loss of the lock.
            - name: Batch e2e (SDK → sequencer → verifier)
              working-directory: ./sdk
              env:
                  REQUIRE_BATCH_E2E: "1"
              run: npx vitest run tests/batch-e2e.test.ts tests/batch-revoke-e2e.test.ts

            - name: Anvil log on failure
              if: failure()
              run: tail -100 /tmp/anvil.log || true
