name: Mutation (dispatch)

# Runs cargo-mutants over the proof program's two host crates, figaro-kernel
# (prover/lib) and figaro-clause (prover/clause), at the commit given as
# input, split across a job matrix with `--shard k/n`. Each shard uploads its
# mutants.out. Started by hand only.
#
# The command is the one scripts/cargo-mutants-run.sh builds:
# `cargo mutants --in-place -p <crate>`, run in prover/. In place, because the
# clause conformance tests read ../clauses/ and ../test/fixtures/ from the
# workspace root, which cargo-mutants' copy of prover/ leaves out. The script
# itself detaches and holds .mewt.lock for a shared machine; a runner is used
# by one shard alone, so the job calls cargo-mutants directly.
#
# The shard count. One mutant's tests took about 33 minutes on a developer
# machine. A hosted job stops at 360 minutes; this one stops at 355. Each
# shard first spends about 15 minutes on the toolchain, the cargo-mutants
# install and the first build, then about 33 on the unmutated baseline that
# cargo-mutants runs before any mutant. That leaves about
# 355 - 15 - 33 = 307 minutes, so 307 / 33 = 9 mutants per shard at most.
# `cargo mutants --list` counts 330 mutants in figaro-kernel and 745 in
# figaro-clause, so ceil(330 / 9) = 37 and ceil(745 / 9) = 83 shards. The
# `auto` default takes 40 and 90 for the margin. Shards are dealt round-robin
# (`--sharding round-robin`), so each holds 8 or 9 mutants and none is empty;
# the slice default leaves the last shards empty. A standard runner (4 cores,
# 16 GB) is slower than the developer machine, so a shard may still run out
# of time: raise `shards` and run again. A caught mutant usually fails fast;
# the 33 minutes is the cost of one that runs the whole suite.
#
# Both crates under `auto` make 130 jobs, within the 256 a matrix allows. An
# account runs a limited number of jobs at once (20 on the free plan), so the
# matrix queues: about seven rounds of up to six hours.
#
# mewt over the contracts is left out. scripts/mewt-run.sh runs
# `mewt run <target.sol>` and needs a mewt.toml whose [targets] and [test]
# point at the target, but mewt.toml is in .gitignore and no copy is in the
# repository, so a checkout carries no mewt configuration to run.

on:
    workflow_dispatch:
        inputs:
            commit:
                description: "Full 40-character commit sha to check out (a branch name is refused)"
                required: true
                type: string
            crate:
                description: "Which crate to mutate"
                type: choice
                options: [both, figaro-kernel, figaro-clause]
                default: both
            shards:
                description: "Shards per crate: auto (40 for figaro-kernel, 90 for figaro-clause) or a number from 1 to 128"
                required: false
                type: string
                default: auto

permissions:
    contents: read

concurrency:
    group: mutation-${{ inputs.commit }}
    cancel-in-progress: false

env:
    CARGO_MUTANTS_VERSION: 27.1.0

jobs:
    preflight:
        name: Validate inputs, build the shard matrix
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            sha: ${{ steps.v.outputs.sha }}
            matrix: ${{ steps.v.outputs.matrix }}
        steps:
            - name: Validate inputs
              id: v
              env:
                  COMMIT: ${{ inputs.commit }}
                  CRATE: ${{ inputs.crate }}
                  SHARDS: ${{ inputs.shards }}
              run: |
                  set -euo pipefail
                  [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character lowercase sha"; exit 1; }
                  case "$CRATE" in
                      both) crates="figaro-kernel figaro-clause" ;;
                      figaro-kernel|figaro-clause) crates="$CRATE" ;;
                      *) echo "::error::crate must be both, figaro-kernel or figaro-clause"; exit 1 ;;
                  esac
                  if [ "$SHARDS" != "auto" ]; then
                      [[ "$SHARDS" =~ ^[0-9]{1,3}$ ]] && (( SHARDS >= 1 && SHARDS <= 128 )) || { echo "::error::shards must be auto or a number from 1 to 128"; exit 1; }
                  fi
                  include="[]"
                  for c in $crates; do
                      if [ "$SHARDS" = "auto" ]; then
                          case "$c" in figaro-kernel) n=40 ;; figaro-clause) n=90 ;; esac
                      else
                          n=$SHARDS
                      fi
                      include=$(jq -c --arg c "$c" --argjson n "$n" \
                          '. + [range(0; $n) | {crate: $c, shard: ., of: $n}]' <<< "$include")
                  done
                  echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
                  echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
                  echo "jobs: $(jq length <<< "$include")"

    cargo-mutants:
        name: cargo-mutants ${{ matrix.crate }} ${{ matrix.shard }}/${{ matrix.of }}
        needs: preflight
        runs-on: ubuntu-24.04
        timeout-minutes: 355
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
        env:
            COMMIT: ${{ needs.preflight.outputs.sha }}
            CRATE: ${{ matrix.crate }}
            SHARD: ${{ matrix.shard }}
            OF: ${{ matrix.of }}
        steps:
            - name: Checkout the commit
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ needs.preflight.outputs.sha }}
                  persist-credentials: false

            - name: Check that HEAD is the commit
              run: |
                  head=$(git rev-parse HEAD)
                  [ "$head" = "$COMMIT" ] || { echo "::error::HEAD is $head, not $COMMIT"; exit 1; }

            # The same read prover-ci.yml makes: prover/rust-toolchain.toml.
            - name: Read pinned Rust toolchain
              run: |
                  RUST_TOOLCHAIN=$(awk -F'"' '/^channel/{print $2}' prover/rust-toolchain.toml)
                  if [ -z "$RUST_TOOLCHAIN" ]; then
                      echo "could not read channel from prover/rust-toolchain.toml"
                      exit 1
                  fi
                  echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

            - name: Install Rust
              run: |
                  rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
                  rustup default "$RUST_TOOLCHAIN"
                  rustc --version

            - name: Install cargo-mutants
              run: |
                  cargo install --locked cargo-mutants --version "$CARGO_MUTANTS_VERSION"
                  cargo mutants --version

            # Exit codes of cargo-mutants: 0 every mutant caught or unviable,
            # 2 a mutant missed, 3 a mutant timed out, 4 the baseline failed.
            # The step keeps the code and the last step decides.
            - name: cargo mutants --shard
              id: run
              working-directory: ./prover
              run: |
                  set -uo pipefail
                  out="$RUNNER_TEMP/mutants"
                  mkdir -p "$out"
                  cargo mutants --in-place -p "$CRATE" --sharding round-robin --shard "$SHARD/$OF" -o "$out" > "$out/console.log" 2>&1
                  code=$?
                  tail -40 "$out/console.log"
                  echo "code=$code" >> "$GITHUB_OUTPUT"
                  exit 0

            - name: Job summary
              if: always()
              env:
                  CODE: ${{ steps.run.outputs.code }}
              run: |
                  m="$RUNNER_TEMP/mutants/mutants.out"
                  count() { if [ -f "$m/$1" ]; then grep -c . "$m/$1" || true; else echo 0; fi; }
                  {
                      echo "## cargo-mutants $CRATE, shard $SHARD/$OF"
                      echo ""
                      echo "- Commit: \`$COMMIT\`"
                      echo "- cargo-mutants $CARGO_MUTANTS_VERSION, exit ${CODE:-none}"
                      echo "- caught $(count caught.txt), missed $(count missed.txt), timeout $(count timeout.txt), unviable $(count unviable.txt)"
                      if [ -s "$m/missed.txt" ]; then
                          echo ""
                          echo "Missed:"
                          echo '```'
                          cat "$m/missed.txt"
                          echo '```'
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload mutants.out
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mutants-${{ matrix.crate }}-${{ needs.preflight.outputs.sha }}-shard-${{ matrix.shard }}-of-${{ matrix.of }}
                  path: ${{ runner.temp }}/mutants
                  retention-days: 90
                  if-no-files-found: warn

            - name: Fail on a missed or timed-out mutant, or a failed baseline
              env:
                  CODE: ${{ steps.run.outputs.code }}
              run: |
                  [ "$CODE" = "0" ] || { echo "::error::cargo-mutants exited $CODE"; exit 1; }
