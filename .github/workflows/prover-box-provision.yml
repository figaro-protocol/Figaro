name: Prover box provision (dispatch)

# Started by hand. Runs scripts/prover-box/provision.sh, as it stands at the
# commit given as `commit`, on a clean Ubuntu 24.04 container, so that the
# rented prover box is not the first clean machine the script meets. The
# container shares the runner's Docker daemon through its socket, as the
# script pulls two images; it makes no swap file (SWAP_GB=0), which a
# container has no room and no leave for.
#
# What the run holds: the script runs to its end; and a shell that reads no
# profile, as a command sent over ssh does, finds every tool the box's steps
# call (jq, the four Foundry tools, Node, cargo, cargo-prove), the checkout at
# the commit, its submodules, the SDK built and both images pulled.
#
# The script clones the repository at `commit` from GitHub, so the commit
# must be pushed. Start the workflow from the branch whose head it is.
#
# Start it:
#     gh workflow run prover-box-provision.yml --ref <branch> -f commit=<sha>

on:
    workflow_dispatch:
        inputs:
            commit:
                description: "Full 40-character sha the run must be at: start the workflow from the branch or tag whose head it is"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: prover-box-provision-${{ inputs.commit }}
    cancel-in-progress: false

jobs:
    provision:
        name: provision.sh on clean Ubuntu 24.04
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        env:
            COMMIT: ${{ inputs.commit }}
        steps:
            - name: Validate the commit
              run: |
                  set -euo pipefail
                  [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character lowercase sha"; exit 1; }

            - name: Checkout the commit
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Check that HEAD is the commit
              uses: ./.github/actions/check-head
              with:
                  commit: ${{ env.COMMIT }}

            - name: Room on the runner
              run: df -h / | tail -1

            - name: provision.sh in a clean container, then the tools from a bare shell
              run: |
                  set -euo pipefail
                  docker run --rm \
                      -v /var/run/docker.sock:/var/run/docker.sock \
                      -v "$PWD/scripts/prover-box:/provision:ro" \
                      -e SWAP_GB=0 -e COMMIT="$COMMIT" \
                      ubuntu:24.04 bash -c '
                          set -euo pipefail
                          bash /provision/provision.sh "$COMMIT" /root/Figaro
                          # A shell with no profile read, as `ssh host cmd` gives.
                          env -i HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin bash -c "
                              set -euo pipefail
                              jq --version
                              forge --version
                              cast --version
                              anvil --version
                              node --version
                              /root/.cargo/bin/cargo --version
                              /root/.sp1/bin/cargo-prove prove --version
                              test \"\$(git -C /root/Figaro rev-parse HEAD)\" = \"$COMMIT\"
                              test -d /root/Figaro/lib/forge-std/src
                              test -f /root/Figaro/sdk/dist/index.js
                              test -d /root/Figaro/frontend/node_modules
                              docker image ls --format \"{{.Repository}}:{{.Tag}}\" | grep -E \"succinctlabs/sp1(-gnark)?:\"
                              echo TOOLS-FOUND
                          "
                      '

            - name: Room left
              if: always()
              run: df -h / | tail -1
