name: Foundry CI

on:
    push:
        branches: [main, develop]
        paths:
            - "src/**"
            - "test/**"
            - "script/**"
            - "foundry.toml"
            - ".github/workflows/foundry-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "src/**"
            - "test/**"
            - "script/**"
            - "foundry.toml"

permissions:
    contents: read

jobs:
    test:
        name: Forge Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0

            - name: Run forge build
              run: forge build --via-ir

            - name: Run forge tests
              run: forge test --via-ir -vvv

            - name: Run forge fmt check
              run: forge fmt --check

    # NOTE: no coverage job yet — scripts/coverage.sh currently FAILS at
    # instrumented compilation (Yul stack-too-deep even under --ir-minimum;
    # reproduced 2026-08-04). Fix the instrumentation first, then add the
    # job + lcov artifact upload. Tracked in the punch-list (audit handover).

    # Formal-proof coverage in CI is halmos/z3 only. Certora is EXCLUDED by
    # design: it needs the operator-held CERTORAKEY, supplied inline at run
    # time (CERTORAKEY=<key> ./scripts/test-certora.sh) and never stored, so
    # it cannot run key-less in CI. Echidna (long-horizon fuzzing) and TLA+
    # (model-level) remain local harnesses — see docs/TESTING.md.
    halmos:
        name: Halmos Symbolic Proofs
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0

            - name: Install z3 and halmos
              run: |
                  sudo apt-get update && sudo apt-get install -y z3
                  pipx install halmos==0.3.3

            - name: Run halmos proofs
              run: ./scripts/test-halmos.sh
