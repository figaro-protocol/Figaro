name: Foundry CI

on:
    workflow_dispatch:
    push:
        branches: [main, develop]
        paths:
            - "src/**"
            - "test/**"
            - "script/**"
            - "lib/**"
            - ".gitmodules"
            - "foundry.toml"
            - ".github/workflows/foundry-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "src/**"
            - "test/**"
            - "script/**"
            - "lib/**"
            - ".gitmodules"
            - "foundry.toml"

permissions:
    contents: read

jobs:
    test:
        name: Forge Test
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Run forge build
              run: forge build --via-ir

            # The suite runs at -vv. Tracing (-vvv) turns on forge's revert
            # diagnostic, which hands a test the text "call to non-contract
            # address" in place of an empty revert's data, and the expectation
            # decoder panics on the empty expectation (forge 1.5.1). A failing
            # run reruns its recorded failures at -vvv so their traces print,
            # and the step stays red.
            - name: Run forge tests
              run: |
                  forge test --via-ir -vv || {
                      forge test --via-ir -vvv --rerun
                      exit 1
                  }

            - name: Run forge fmt check
              run: forge fmt --check

    # The three tests that need a live chain's state: the coordinator against
    # the canonical Permit2 on mainnet, and against SwapRouter02 on Sepolia.
    # They skip when their RPC variable is unset, and a skip proves nothing, so
    # this job sets both to public nodes and fails on any test that did not
    # run. It is a job of its own so that a public node's outage reads as that
    # and leaves the main suite's verdict standing.
    fork:
        name: Fork tests (real Permit2, real SwapRouter02)
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Run the fork tests, none skipped
              env:
                  MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
                  SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
              run: |
                  set -o pipefail
                  forge test --via-ir --match-path test/composability/WitnessSwapAndCommitCoordinatorForkTest.t.sol | tee fork.log
                  if grep -q '\[SKIP\]' fork.log; then
                      echo "a fork test skipped: its RPC variable did not reach it"
                      exit 1
                  fi

    coverage:
        name: Forge Coverage
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            # scripts/coverage.sh runs FOUNDRY_PROFILE=coverage forge coverage, which
            # forge 1.5.1 compiles on the legacy un-optimized build whatever the profile
            # says (--ir-minimum is not passed: under coverage instrumentation that path
            # fails stack-too-deep in the batch verifier's decoder). It also excludes
            # the five gas-anchor tests calibrated for non-instrumented bytecode
            # (see the script's own comment). --report lcov writes lcov.info at
            # the repo root alongside the printed summary table.
            - name: Run forge coverage
              run: bash scripts/coverage.sh --report lcov --report summary

            - name: Upload lcov report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: lcov-report
                  path: lcov.info
                  retention-days: 14

    # Formal-proof coverage in CI is halmos/z3 only. Certora is EXCLUDED by
    # design: it needs the maintainer-held CERTORAKEY, supplied inline at run
    # time (CERTORAKEY=<key> ./scripts/test-certora.sh) and never stored, so
    # it cannot run key-less in CI. Echidna (long-horizon fuzzing) and TLA+
    # (model-level) remain local harnesses — see docs/TESTING.md.
    halmos:
        name: Halmos Symbolic Proofs
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Install z3 and halmos
              run: |
                  sudo apt-get update && sudo apt-get install -y z3
                  pipx install halmos==0.3.3

            - name: Run halmos proofs
              run: ./scripts/test-halmos.sh

    # Static analysis over the audit scope: Slither (pinned to the version the
    # audit handover triaged) and Semgrep's smart-contract ruleset. The contracts
    # are built on the host with the same Foundry pin as every other job and the
    # Slither container reads out/build-info (ignore-compile), so the numbers
    # here are the handover's numbers.
    #
    # fail-on is `none` with an explicit gate, not a level: every --fail-<level>
    # flag fails on that level OR GREATER, and the tree carries two designed
    # High results (arbitrary-send-erc20 in `_pullExact`, FigaroCore and verifier —
    # docs/AUDITOR_HANDOVER.md § "Static analysis"), so no level passes today.
    # The gate holds the effective level at Medium: the High and Medium results
    # must be exactly the eight the handover triages, each by its identity (the
    # detector, the function it names and the source text of the statements it
    # points at, never a line number, so moving a line keeps the identity) — a
    # new one at either level fails, even when it replaces a fixed one of the
    # same detector, and so does one vanishing, since the triage table would
    # then be stale. Low and Informational are printed, not gated. To
    # regenerate after a triage: build and run Slither as the two steps below
    # do, then print each High/Medium result's identity with the gate's
    # `identity` function and paste the list into `triaged`.
    static-analysis:
        name: Static Analysis
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            # The build crytic-compile would run itself, done on the pinned
            # toolchain instead (build_info is off in foundry.toml; the flag
            # turns it on for this build only).
            - name: Build with build-info for Slither
              run: forge build --build-info --skip '*/test/**' '*/script/**' --force

            - name: Run Slither
              uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
              with:
                  slither-version: 0.11.3
                  ignore-compile: true
                  fail-on: none
                  slither-args: --filter-paths "src/mocks|src/echidna|test/|lib/|script/" --exclude-dependencies --json slither.json

            - name: Gate Slither on the triaged High and Medium results
              run: |
                  python3 - <<'PY'
                  import collections, json, sys
                  results = json.load(open("slither.json"))["results"].get("detectors", [])

                  def identity(r):
                      # The detector, the function it names, and the source text of each
                      # statement it points at, never a line number: an edit that moves a line
                      # keeps a finding's identity, and a new finding of a triaged detector is a
                      # new identity.
                      head, *rest = r["elements"]
                      parent = head.get("type_specific_fields", {}).get("parent", {}).get("name")
                      where = head["source_mapping"]["filename_relative"] + ":" + (parent + "." if parent else "") + head["name"]
                      nodes = " ; ".join(e["name"] for e in rest if e["type"] == "node")
                      return f'{r["impact"]} {r["check"]} {where} :: {nodes}'

                  found = collections.Counter(identity(r) for r in results if r["impact"] in ("High", "Medium"))
                  triaged = collections.Counter([
                      "High arbitrary-send-erc20 src/core/kernel/FigaroCore.sol:FigaroCore._pullExact :: token.safeTransferFrom(from,address(this),amount)",
                      "High arbitrary-send-erc20 src/core/verifier/FigaroBatchVerifier.sol:FigaroBatchVerifier._pullExact :: token.safeTransferFrom(from,address(this),amount)",
                      "Medium incorrect-equality src/registries/MembersRegistry.sol:MembersRegistry.withdraw :: unlockAt == 0",
                      "Medium reentrancy-no-eth src/core/verifier/FigaroBatchVerifier.sol:FigaroBatchVerifier.settleBatch :: usageCounter.applyBatchAccrual(usage.period,usage.provenanceLeaf,usage.uses) ; stateRoot = pv.newRoot",
                      "Medium unused-return src/rewards/RpgfMinter.sol:RpgfMinter._isAuthor :: (agreementRegisteredBy,None,agreementWithdrawn,None) = agreements.bindings(clauseOrAssembly)",
                      "Medium unused-return src/rewards/RpgfMinter.sol:RpgfMinter._isAuthor :: (assemblyRegisteredBy,None,depositWithdrawn,None) = assemblies.bindings(clauseOrAssembly)",
                      "Medium unused-return src/rewards/UsageCounter.sol:UsageCounter._agreementLive :: (registeredBy,registeredAt,depositWithdrawn,None) = agreements.bindings(agreementHash)",
                      "Medium unused-return src/rewards/UsageCounter.sol:UsageCounter._assemblyLive :: (registeredBy,registeredAt,depositWithdrawn,None) = assemblies.bindings(clauseOrAssembly)",
                  ])
                  if found != triaged:
                      print("Slither High/Medium results differ from docs/AUDITOR_HANDOVER.md § Static analysis:")
                      for key in sorted((found - triaged).elements()):
                          print(f"  new:     {key}")
                      for key in sorted((triaged - found).elements()):
                          print(f"  missing: {key}")
                      sys.exit(1)
                  print(f"Slither: {len(results)} results; the {sum(triaged.values())} High/Medium results are the triaged set")
                  PY

            # p/smart-contracts returns only INFO gas-style rules on this tree;
            # any WARNING or ERROR fails the job (--error).
            - name: Install Semgrep
              run: pipx install semgrep==1.176.1

            - name: Run Semgrep
              run: semgrep --config p/smart-contracts --error --severity ERROR --severity WARNING src/core src/registries src/rewards src/composability
