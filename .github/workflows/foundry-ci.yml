name: Foundry CI

on:
    workflow_dispatch:
    push:
        branches: [main, develop]
        paths:
            - "src/**"
            - "test/**"
            - "script/**"
            - "foundry.toml"
            - ".github/workflows/foundry-ci.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "src/**"
            - "test/**"
            - "script/**"
            - "foundry.toml"

permissions:
    contents: read

jobs:
    test:
        name: Forge Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Run forge build
              run: forge build --via-ir

            - name: Run forge tests
              run: forge test --via-ir -vvv

            - name: Run forge fmt check
              run: forge fmt --check

    coverage:
        name: Forge Coverage
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            # scripts/coverage.sh runs FOUNDRY_PROFILE=coverage forge coverage
            # --ir-minimum (full Yul IR pipeline, needed to avoid stack-too-deep
            # from the shadow counters coverage instrumentation inserts per
            # source statement — plain via-ir is not enough). It also excludes
            # the two gas-anchor tests calibrated for non-instrumented bytecode
            # (see the script's own comment). --report lcov writes lcov.info at
            # the repo root alongside the printed summary table.
            - name: Run forge coverage
              run: bash scripts/coverage.sh --report lcov --report summary

            - name: Upload lcov report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: lcov-report
                  path: lcov.info
                  retention-days: 14

    # Formal-proof coverage in CI is halmos/z3 only. Certora is EXCLUDED by
    # design: it needs the maintainer-held CERTORAKEY, supplied inline at run
    # time (CERTORAKEY=<key> ./scripts/test-certora.sh) and never stored, so
    # it cannot run key-less in CI. Echidna (long-horizon fuzzing) and TLA+
    # (model-level) remain local harnesses — see docs/TESTING.md.
    halmos:
        name: Halmos Symbolic Proofs
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
              with:
                  version: v1.5.1

            - name: Install z3 and halmos
              run: |
                  sudo apt-get update && sudo apt-get install -y z3
                  pipx install halmos==0.3.3

            - name: Run halmos proofs
              run: ./scripts/test-halmos.sh
