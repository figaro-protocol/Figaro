version: 2
# POLICY (maintainer-ruled 2026-08-13): routine version-bump PRs are DISABLED
# (open-pull-requests-limit: 0 on every ecosystem) — the audited surface is
# frozen and dependency churn is noise. Dependabot SECURITY updates remain on
# (repo setting, independent of these limits) and still open PRs when a used
# dependency has an advisory. Triage of anything Dependabot opens is the
# maintainer-agent's job. The groups/schedules below are kept so re-enabling
# is a one-line change per ecosystem.
updates:
    # Root workspace. sdk/ is an npm workspace of this manifest with no own
    # lockfile (docs/LOCAL_DEV.md, package.json "workspaces": ["sdk"]) — its
    # dependency updates are proposed against this root manifest, not a
    # separate sdk/ entry.
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          npm-production:
              dependency-type: "production"
          npm-development:
              dependency-type: "development"
      open-pull-requests-limit: 0

    # Frontend — its own package.json/package-lock.json, not part of the root
    # npm workspace.
    - package-ecosystem: "npm"
      directory: "/frontend"
      schedule:
          interval: "weekly"
      groups:
          frontend-production:
              dependency-type: "production"
          frontend-development:
              dependency-type: "development"
      open-pull-requests-limit: 0

    # prover/ — the Rust SP1 proof workspace (5 crates, one Cargo.lock).
    - package-ecosystem: "cargo"
      directory: "/prover"
      schedule:
          interval: "weekly"
      groups:
          cargo-dependencies:
              patterns:
                  - "*"
      open-pull-requests-limit: 0

    # Pinned Action SHAs (every `uses:` line in .github/workflows/ is pinned
    # by commit, not by tag) — Dependabot proposes the version bump with the
    # comment updated, never a silent floating-tag drift.
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          github-actions:
              patterns:
                  - "*"
      open-pull-requests-limit: 0
