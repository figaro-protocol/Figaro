name: Pinned Rust toolchain
description: >-
    Reads the Rust channel from prover/rust-toolchain.toml, installs it and makes it the
    default. Leaves RUST_TOOLCHAIN in the job's environment. The one owner of this step:
    a workflow that needs Rust calls it after its checkout.
runs:
    using: composite
    steps:
        - name: Read the pinned Rust toolchain
          shell: bash
          run: |
              RUST_TOOLCHAIN=$(awk -F'"' '/^channel/{print $2}' prover/rust-toolchain.toml)
              if [ -z "$RUST_TOOLCHAIN" ]; then
                  echo "could not read channel from prover/rust-toolchain.toml"
                  exit 1
              fi
              echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
              echo "pinned Rust toolchain: $RUST_TOOLCHAIN"
              rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
              rustup default "$RUST_TOOLCHAIN"
              rustc --version
