# Figaro beta RPC proxy — JSON-RPC method allowlist + contract-address
# allowlist + container backing.
#
# Routes `/rpc` on the opaque subdomain. Validates that the request
# carries a valid session cookie (same SESSIONS KV as the gate Worker),
# inspects the JSON-RPC method, rejects non-allowlisted methods,
# rejects eth_call to non-allowlisted contract addresses, and forwards
# approved requests to the Anvil container.
#
# Without this Worker, beta participants can fetch raw bytecode via
# eth_getCode and the kernel is one decompile away from public.

name = "figaro-rpc-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Shared with the gate Worker — same session cookie validates here.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_NAMESPACE_ID"

# Allowlist of contract addresses that eth_call / eth_estimateGas
# may target. Key = lowercased 0x... address. Value = JSON metadata
# (e.g., logical name, deployment date — for operator audit).
# Calls to addresses NOT in this namespace are rejected.
[[kv_namespaces]]
binding = "CONTRACT_ALLOWLIST"
id = "REPLACE_WITH_CONTRACT_ALLOWLIST_NAMESPACE_ID"

# The Anvil container that backs this Worker.
# Built from ../../anvil-container/Dockerfile and pushed via
# `wrangler containers push figaro-anvil:latest`.
[[containers]]
class_name = "AnvilContainer"
image = "registry.cloudflare.com/<account>/figaro-anvil:latest"
max_instances = 1

[[durable_objects.bindings]]
name = "ANVIL"
class_name = "AnvilContainer"

# Persistent storage for Anvil's --state JSON.
# Lives in a Durable Object volume; survives container restarts but
# resettable by the operator (see ../../anvil-container/README.md).
[[migrations]]
tag = "v1"
new_classes = ["AnvilContainer"]
