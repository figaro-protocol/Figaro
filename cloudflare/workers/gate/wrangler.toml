# Figaro beta gate — code-redemption Worker.
#
# Routes /* (everything except /rpc) on the opaque subdomain. Validates
# access codes, establishes sessions in KV, forwards authenticated
# requests to the Pages-hosted Next.js app.
#
# After provisioning the KV namespaces with `wrangler kv:namespace create`,
# paste the returned IDs into the placeholders below.

name = "figaro-gate"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# KV namespace holding valid access codes.
# Key = the code string. Value = JSON { issuedAt, note, redeemedAt? }.
# Codes are one-shot: once redeemed, the value's `redeemedAt` field
# is set and the worker rejects further redemption attempts.
[[kv_namespaces]]
binding = "CODES"
id = "REPLACE_WITH_CODES_NAMESPACE_ID"

# KV namespace holding active sessions.
# Key = session ID (random UUID). Value = JSON { code, redeemedAt }.
# Cookie `figaro-session` carries the session ID.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_NAMESPACE_ID"

# Where authenticated requests forward to.
# This is the Cloudflare Pages URL of the Next.js app (figaro frontend).
# Set via `wrangler secret put PAGES_ORIGIN` in production; the placeholder
# below is for local-dev `wrangler dev`.
[vars]
PAGES_ORIGIN = "https://figaro-frontend.pages.dev"

# Session cookie lifetime in seconds. 30 days by default.
# Trade-off: longer = fewer re-redemptions; shorter = faster revocation.
[vars]
SESSION_TTL_SECONDS = "2592000"
