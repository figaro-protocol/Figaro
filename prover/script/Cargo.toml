[package]
name = "figaro-prove-test"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version.workspace = true

[[bin]]
name = "prove"
path = "src/main.rs"

[dependencies]
figaro-kernel = { path = "../lib" }
sp1-sdk = "6.0"
# `float_roundtrip`: the canonicalizer reads a spec's fractions and writes
# them back as ECMAScript does, so each must survive the parse exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
alloy-primitives = { version = "1", features = ["serde"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
tokio = { version = "1", features = ["full"] }
# Used to size the generated proof after Stage 2 succeeds.
bincode = "1.3"

[build-dependencies]
sp1-build = "6.0"
