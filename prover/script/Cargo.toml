[package]
name = "figaro-prove-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prove"
path = "src/main.rs"

[dependencies]
figaro-kernel = { path = "../lib" }
# Used to build the canonical content_proof on the seller attestation so
# the end-to-end SP1 run exercises the Layer B gate in the zkVM.
figaro-schema = { path = "../schema" }
sp1-sdk = "6.0"
serde_json = "1"
alloy-primitives = { version = "0.8", features = ["serde"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
tokio = { version = "1", features = ["full"] }
# Used to size the generated proof after Stage 2 succeeds.
bincode = "1.3"

[build-dependencies]
sp1-build = "6.0"
