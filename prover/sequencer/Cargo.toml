[package]
name = "figaro-sequencer"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "sequencer"
path = "src/main.rs"

[dependencies]
figaro-kernel = { path = "../lib" }
# `network`: `SP1_PROVER=network` submits program + inputs to the Succinct
# Prover Network and receives the proof — a liveness-only proof source (the
# proof still verifies against the program vkey; no prover can forge one).
# Local `cpu`/`cuda` proving is unchanged. Needs alloy 1.x (the 2026-08-18 bump).
sp1-sdk = { version = "6.0", features = ["network"] }
alloy-primitives = { version = "1", features = ["serde"] }
alloy-sol-types = "1"
alloy = { version = "1", features = ["full", "node-bindings"] }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
sp1-build = "6.0"

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
tower = { version = "0.5", features = ["util"] }

# Canonical batch fixtures (witness-based ops) shared with the prove-test harness.
figaro-prove-test = { path = "../script" }
