[package]
name = "figaro-clause"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Generic clause-validation engine — the Rust mirror of @figaro/sdk/clauses (TS Layer A). Used by the SP1 zkVM prover and the sequencer; validates any clause spec supplied as witness input."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Regex is needed for user-supplied `pattern` constraints on string fields
# (only one protocol clause uses it today — figaro-geo-v2's geohash pattern —
# but the format must support any closed regex per the spec). SP1's zkVM
# supports `regex` via standard riscv compilation.
regex = "1"
# Per-clause content encoders (encode.rs) produce ABI-encoded bytes from
# the validated JSON content. Output is byte-for-byte identical to viem's
# encodeAbiParameters in `sdk/src/clauses/encode.ts` — this is the
# cross-form binding the kernel uses to bind content_ref to content_json.
alloy-primitives = "1"
alloy-dyn-abi = "1"
