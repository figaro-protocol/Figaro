[package]
name = "figaro-kernel"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
# Layer B clause validator — invoked from apply_batch when an attestation
# op carries a content payload. See validate_attestation_content() in
# kernel.rs.
figaro-clause = { path = "../clause" }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
bincode = "1.3"
