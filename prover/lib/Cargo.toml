[package]
name = "figaro-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
