[package]
name = "figaro-rpgf-script"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rpgf-prove"
path = "src/main.rs"

[dependencies]
figaro-rpgf = { path = "../rpgf" }
sp1-sdk = { version = "6.0", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-primitives = { version = "0.8", features = ["serde"] }

[build-dependencies]
sp1-build = "6.0"
