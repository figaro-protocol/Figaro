[workspace]
# The clause engine landed first in the rebuild; the kernel mirror,
# guest program, prove-script, and sequencer crates rejoin as each is
# realigned to the current contract ABIs.
members = ["clause", "lib", "program", "script", "sequencer"]
# Resolver 3 honours `rust-version`: with the host toolchain pinned to 1.93.0
# (rust-toolchain.toml — the release's reproducibility pin), dependency
# resolution picks the newest versions that still build on it (the AWS SDK
# behind sp1-sdk's `network` feature moved its floor past 1.93 in 2026-07).
resolver = "3"

[workspace.package]
rust-version = "1.93.0"

# SP1 accelerates secp256k1 via a precompile. The kernel ELF verifies ~7
# EIP-712 ECDSA signatures per batch; unpatched, that dominates the cycle
# count (measured ~19.8M cycles). The k256 patch routes ECDSA verification
# through the SP1 secp256k1 precompile. Tag pinned to k256 0.13.4 + SP1
# 6.0.x — the toolchain this workspace builds against.
#
# keccak is left unpatched: the kernel hashes via alloy-primitives, not the
# sha3 crate, and keccak is a small fraction of the cycle budget next to ECDSA.
[patch.crates-io]
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
